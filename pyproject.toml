[project]
name = "sirius-personal-engineer"
version = "0.1.0.dev0"
description = "Sirius 0.1: companion for personal creation and engineering"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary" }
authors = [
  { name = "Sirius Project" }
]
dependencies = [
  "PySide6>=6.11.1,<7",
  "SQLAlchemy>=2.0.51,<3",
  "alembic>=1.18.5,<2",
  "pydantic>=2.11,<3",
  "platformdirs>=4.3,<5",
  "keyring>=25.6,<26",
  "openai>=2.45,<3",
  "cryptography>=45",
  "argon2-cffi>=25",
  "pyyaml>=6.0",
]

[project.scripts]
sirius = "sirius.main:main"
sirius-voz = "sirius.voice_doctor:main"
sirius-obs = "sirius.capture_setup:main"
# La costura entre una orden y la vía GitHub (C2). El despachador existía y
# nadie lo llamaba: su cableado era la frontera declarada del bloque.
sirius-despachar = "sirius_engine.dispatch_cli:main"
# El comando del motor (M1, ADR-055). Hasta el 21-08-2026 M1 se daba por
# alcanzado sin que existiera: la "interfaz v0" era una clase que solo
# construían las pruebas. `tests/engine/test_cli_entrypoint.py` parte de esta
# línea, así que ninguna fusión en verde puede volver a quitarla.
sirius-motor = "sirius_engine.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"
[tool.uv.build-backend]
# Dos módulos, no uno. Con `module-name = "sirius"` el wheel construido NO
# contenía `sirius_engine` (comprobado: 172 ficheros de `sirius/`, 0 de
# `sirius_engine/`), y por tanto la entrada `sirius-motor` habría quedado
# muerta en cuanto alguien instalara el paquete en vez de trabajar en editable.
# En editable funcionaba porque el `.pth` publica `src/` entero, que es
# justo lo que escondía el problema.
module-name = ["sirius", "sirius_engine"]
[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "pytest-qt>=4.5",
  "ruff>=0.12",
  "types-pyyaml>=6.0",
]
# B13: toolchain de empaquetado para Windows. Deliberadamente fuera de las
# dependencias de ejecución y del grupo `dev`: solo `scripts/build_windows.ps1`
# lo sincroniza (`uv sync --frozen --group packaging`), de modo que ni el
# entorno de desarrollo normal ni el artefacto final arrastran Nuitka.
packaging = [
  "nuitka==4.1.3",
  "ordered-set",
  "zstandard",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
# scripts/ contiene helpers de empaquetado invocados desde PowerShell.
# mypy_path es imprescindible, y no basta con "files": scripts/check.ps1 y la
# comprobacion de calidad ejecutan "mypy src tests" con rutas explicitas, y en
# ese caso mypy ignora "files" y no sabria resolver "zip_package_inspector"
# desde tests/.
files = ["src", "tests", "scripts"]
mypy_path = "scripts"
exclude = ["migrations/versions"]

[[tool.mypy.overrides]]
module = ["PySide6.*", "pytestqt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# scripts/ contiene helpers de empaquetado invocados desde PowerShell; se anaden
# al path para que sus pruebas los importen como modulos normales.
# scripts/: helpers de empaquetado invocados desde PowerShell.
# tests/unit: ayudantes compartidos entre pruebas (tests/ no es un paquete).
pythonpath = ["scripts", "tests/unit"]
addopts = [
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
  "-ra",
]
markers = [
  "integration: tests that use real infrastructure such as SQLite",
  "contract: tests for adapter contracts",
  "gui: tests for Qt presentation",
  "acceptance: end-to-end product acceptance tests",
]
