name: Bootstrap Sirius automation labels

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-sirius-automation-labels.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: bootstrap-sirius-automation-labels
  cancel-in-progress: false

jobs:
  ensure-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create or update automation labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # `gh label create --force` es un upsert: crea la etiqueta si falta y, si
          # ya existe, actualiza color y descripcion. No se usa `gh label view`
          # (subcomando inexistente en gh, que hacia caer en `gh label create` y
          # fallar con "already exists" para etiquetas ya creadas).
          ensure_label() {
            name="$1"
            color="$2"
            description="$3"
            gh label create "$name" --repo "$GH_REPO" --color "$color" --description "$description" --force
          }

          ensure_label "sirius:planned" "D4C5F9" "Estado: trabajo definido y pendiente de activación"
          ensure_label "sirius:implement-requested" "1D76DB" "Evento consumible: iniciar implementación de una incidencia válida"
          ensure_label "sirius:implementing" "5319E7" "Estado: implementación en curso"
          ensure_label "sirius:ci-pending" "BFDADC" "Estado: esperando validación de CI sobre el head registrado"
          ensure_label "sirius:review-requested" "8250DF" "Evento consumible: iniciar revisión independiente"
          ensure_label "sirius:reviewing" "7057FF" "Estado: revisión independiente en curso"
          ensure_label "sirius:repair-requested" "FBCA04" "Evento consumible: corregir observaciones técnicas registradas"
          ensure_label "sirius:repairing" "D4C5F9" "Estado: corrección técnica en curso"
          ensure_label "sirius:blocked-decision" "B60205" "Estado temporal: requiere una decisión humana"
          ensure_label "sirius:failed-safely" "D93F0B" "Estado temporal: fallo operativo detenido de forma segura"
          ensure_label "sirius:ready-for-merge" "0E8A16" "Estado: revisión aprobada y pendiente de autorización humana de merge"
          ensure_label "sirius:completed" "006B75" "Estado terminal: bloque fusionado y cerrado"

          # FUERA de la maquina de estados POR CONSTRUCCION, no por promesa: el
          # ciclo reconoce lo suyo por el PREFIJO `sirius:` (sirius_reconcile.sh
          # filtra con grep '^sirius:'; complete-sirius-after-merge.yml con
          # startswith("sirius:")), asi que esta etiqueta usa OTRO prefijo y esos
          # caminos no pueden verla. Solo dispara el Auditor (ADR-016). La
          # primera version usaba `sirius:audit-requested` y era un error: el
          # prefijo la convertia en estado del ciclo.
          ensure_label "auditoria:solicitada" "5A32A3" "Fuera del ciclo: lanzar una auditoria de solo lectura del repositorio"
