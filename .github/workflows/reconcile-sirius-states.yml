name: Reconciliar estados de Sirius

# Red de seguridad de estados atascados. Repara únicamente estados inequívocos
# (ver scripts/automation/sirius_reconcile.sh), avisa en la incidencia cuando un
# estado que solo la máquina puede mover lleva demasiado tiempo puesto, e
# informa del resto en el resumen del run. Nunca hace merge ni inicia bloques.
#
# Se programa desde la incidencia #138, bajo la excepción del contrato v1.6
# §9.1. La prohibición que había antes aquí —«el contrato prohíbe la vigilancia
# horaria como motor del flujo»— sigue en pie en lo que decía de verdad: esto no
# es el motor. No inicia bloques, no avanza un ciclo sano y no fusiona; solo
# observa estados que ningún evento puede ya revivir, porque `issues: labeled`
# no vuelve a dispararse con una etiqueta ya aplicada.
#
# Cadencia: cada 6 horas. El coste es el argumento, no la comodidad: el job dura
# menos de un minuto y GitHub factura por minuto empezado, así que 4 ejecuciones
# al día son ~120 min/mes de los 2000 gratuitos del repositorio privado. Cada
# hora serían ~720 min/mes, y la latencia de detección no vale ese precio para
# un repositorio de una sola persona. El minuto :17 evita la congestión de las
# horas en punto, donde GitHub retrasa las tareas programadas.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read

concurrency:
  group: reconcile-sirius-states
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconciliar estados atascados
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout automation library
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Reconciliar estados de trabajo
        shell: bash --noprofile --norc {0}
        env:
          # Las LECTURAS del reconciliador (incidencias, PRs y check-runs) van
          # con el GITHUB_TOKEN, que tiene los permisos declarados del workflow
          # (checks: read, etc.); el PAT no tiene esos alcances y daría 403.
          GH_TOKEN: ${{ github.token }}
          # La ESCRITURA de `sirius:review-requested` (única transición que debe
          # despertar al revisor) usa el PAT vía `trigger_transition`, para que
          # el `issues: labeled` no lo suprima la regla anti-recursión.
          SIRIUS_TRIGGER_TOKEN: ${{ secrets.SIRIUS_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          bash scripts/automation/sirius_reconcile.sh "$GH_REPO"
