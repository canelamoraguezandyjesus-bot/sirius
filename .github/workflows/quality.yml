name: Quality

# El ciclo automático de Sirius (implementar → Quality → revisión → corrección)
# ejecuta esta validación en CADA push/PR, así que su coste en minutos es el que
# más pesa. GitHub factura los minutos de Windows a 2x los de Linux; mover esta
# validación a `ubuntu-latest` reduce el consumo a la mitad, es más rápida y
# evita los cuelgues puntuales del runner de Windows. La suite completa —incluida
# la de GUI (PySide6, plugin `offscreen`)— se valida headless en Linux (probado
# localmente y en cada run del implementador). La validación específica de
# Windows queda como comprobación PUNTUAL bajo demanda en `quality-windows.yml`
# (workflow_dispatch), no en cada iteración. La cadena de automatización se ancla
# al nombre de workflow "Quality" y al check "quality" de este job, que no cambian.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # PySide6 corre sin pantalla en el runner Linux: el plugin offscreen evita
      # depender de un servidor X para las pruebas de GUI.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt system libraries for PySide6 (offscreen)
        # Un `apt-get` colgado se comia el trabajo ENTERO. Sin plazo propio, la
        # descarga espera a un espejo que no responde hasta que GitHub cancela el
        # job a los 20 minutos, y una ejecucion `cancelled` detiene el bloque y
        # exige intervencion manual. Ocurrio dos veces el 19-08-2026 —incidencias
        # #202 y #206—, las dos en este mismo paso y sin llegar a ejecutar una
        # sola prueba: 20 min de runner gastados en nada, dos veces.
        #
        # Tres cambios, en este orden de importancia:
        #  1. No instalar lo que ya esta. El runner suele traer estas
        #     bibliotecas; comprobarlo cuesta milisegundos y, cuando estan,
        #     `apt` no llega a ejecutarse y el fallo no puede ocurrir.
        #  2. Plazo propio por intento. Un espejo que no responde cuesta 60 s,
        #     no 20 minutos.
        #  3. Reintento acotado: el fallo observado es transitorio.
        #
        # Y falla RUIDOSAMENTE si de verdad no puede instalar, en vez de dejar
        # que el job muera por tiempo: un `failure` es diagnosticable y el ciclo
        # sabe tratarlo; un `cancelled` no dice nada y para el bloque.
        #
        # El plazo de paso es la red de seguridad de ultimo recurso: si los
        # plazos internos fallaran, el paso muere en 6 min con `failure`, no
        # el trabajo entero en 20 con `cancelled`.
        timeout-minutes: 10
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          faltan=""
          for lib in libegl1 libgl1 libxkbcommon0; do
            dpkg -s "$lib" >/dev/null 2>&1 || faltan="${faltan} ${lib}"
          done
          if [ -z "$(printf '%s' "$faltan" | tr -d '[:space:]')" ]; then
            echo "Las tres bibliotecas ya estan instaladas; no se toca apt."
            exit 0
          fi
          echo "Faltan por instalar:${faltan}"
          # Intento 1: instalar SIN `update`. La imagen del runner ya trae listas
          # de paquetes, y suelen bastar. Esto evita por completo el paso lento:
          # `apt-get update` refresca TODOS los origenes configurados —Microsoft,
          # Google, Docker...— y ninguno de ellos sirve para estas tres.
          # shellcheck disable=SC2086
          if timeout 150 sudo apt-get install -y --no-install-recommends ${faltan}; then
            echo "Instaladas sin necesidad de refrescar las listas."
            exit 0
          fi
          echo "::warning::No bastaron las listas existentes; refresco e intento otra vez."
          # Intento 2: refrescar y reinstalar, con plazos HOLGADOS. El fallo
          # observado el 19-08 no fue un espejo caido sino uno LENTO: se corto a
          # los 60 s una descarga que iba avanzando. Un plazo demasiado corto
          # convierte lentitud en fallo, que es otra forma de romper el ciclo.
          if timeout 240 sudo apt-get update; then
            # shellcheck disable=SC2086
            if timeout 180 sudo apt-get install -y --no-install-recommends ${faltan}; then
              echo "Instaladas tras refrescar las listas."
              exit 0
            fi
          fi
          echo "::error::No se pudieron instalar las bibliotecas de Qt (${faltan}) con plazos acotados."
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.14.6"

      - name: Sync environment
        run: uv sync --locked --all-groups

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src tests

      - name: Pytest
        run: uv run pytest
