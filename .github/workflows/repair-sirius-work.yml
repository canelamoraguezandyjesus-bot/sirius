name: Corregir bloque Sirius

# Ejecuta la Routine correctora genérica de Sirius con Claude Code real,
# dentro de este mismo runner, en cuanto se aplica sirius:repair-requested.
# Ver la cabecera de implement-sirius-work.yml para el contexto general del
# mecanismo y el aviso sobre verificar la interfaz de
# `anthropics/claude-code-action`.
#
# Convergencia técnica en vez de un tope fijo de ciclos (contrato §5, v1.5).
# El límite anterior de dos ciclos era arbitrario: detenía trabajos que seguían
# siendo puramente técnicos y que progresaban ronda a ronda. Ahora la puerta
# consulta `scripts/automation/sirius_convergence.py`, que compara las huellas
# estables de los hallazgos de cada ronda publicadas por
# `sirius_apply_verdict.sh` y decide de forma determinista:
#
#   - CONTINUE mientras haya progreso comprobable (menos hallazgos pendientes,
#     menor gravedad agregada o resolución de hallazgos concretos);
#   - BLOCK, con motivo exacto, cuando no hay progreso neto en dos rondas
#     consecutivas, un hallazgo dado por resuelto reaparece, el conjunto de
#     hallazgos oscila entre estados anteriores, el head no avanzó o el
#     historial no se puede leer.
#
# El bloqueo sigue aplicando sirius:blocked-decision SIN invocar a Claude: no
# se gasta una ejecución cuando la decisión ya es humana.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: sirius-repair-${{ github.event.issue.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  repair:
    name: Corregir con Claude Code
    if: github.event.label.name == 'sirius:repair-requested'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          # A diferencia del resto de workflows de este repositorio, este SÍ
          # necesita hacer push (el corrector sube nuevos commits a la PR).
          persist-credentials: true
          # Con el PAT (no el GITHUB_TOKEN por defecto), el push de la corrección
          # genera un evento `synchronize` que SÍ vuelve a disparar Quality; con
          # el token por defecto ese re-disparo quedaría suprimido y el ciclo
          # revisión→corrección→revisión no cerraría.
          token: ${{ secrets.SIRIUS_BOT_TOKEN }}

      - name: Evaluar la convergencia y localizar la PR
        id: gate
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          source scripts/automation/sirius_issue.sh

          # Numeración de la ronda: el mayor marcador `<!-- sirius-round:N -->`
          # publicado por el revisor. El marcador heredado
          # `<!-- sirius-repair-cycle:N -->` sigue emitiéndose para trazabilidad
          # histórica, pero ya no gobierna ninguna decisión.
          next_cycle="$(sirius_next_round_number "$GH_REPO" "$ISSUE_NUMBER")"

          # Decisión de convergencia sobre el historial completo de rondas.
          comments_file="$(mktemp)"
          decision_file="$(mktemp)"
          if ! sirius_dump_comments "$GH_REPO" "$ISSUE_NUMBER" "$comments_file"; then
            marker="<!-- sirius-verdict:corrector:precheck:historial-ilegible:${GITHUB_RUN_ID:-manual}-${GITHUB_RUN_ATTEMPT:-1} -->"
            body_file="$(mktemp)"
            printf '%s\n\n%s\n\n%s\n' \
              "$marker" "🔴 **Me he detenido de forma segura**" \
              "No he podido leer el historial de rondas de esta incidencia, así que no puedo demostrar que la corrección siga progresando. Me detengo en vez de corregir a ciegas." >"$body_file"
            sirius_transition "$GH_REPO" "$ISSUE_NUMBER" "$marker" "$body_file" \
              "sirius:failed-safely" "D93F0B" "Estado temporal: fallo operativo detenido de forma segura" \
              "noclose" "sirius:repair-requested" || echo "::error::No se pudo aplicar la parada segura (historial-ilegible)."
            rm -f "$body_file" "$comments_file" "$decision_file"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/automation/sirius_convergence.py decide \
            --comments-file "$comments_file" --output "$decision_file" || true
          decision="$(jq -r '.decision // "BLOCK"' "$decision_file" 2>/dev/null || echo BLOCK)"
          reason="$(jq -r '.reason // "indeterminado"' "$decision_file" 2>/dev/null || echo indeterminado)"
          detail="$(jq -r '.detail // "No se pudo evaluar la convergencia."' "$decision_file" 2>/dev/null || echo "No se pudo evaluar la convergencia.")"
          rounds="$(jq -r '.rounds // 0' "$decision_file" 2>/dev/null || echo 0)"
          rm -f "$comments_file" "$decision_file"

          if [ "$decision" != "CONTINUE" ]; then
            marker="<!-- sirius-verdict:corrector:precheck:convergencia-${reason} -->"
            body_file="$(mktemp)"
            printf '%s\n\n%s\n\n%s\n\n%s\n' \
              "$marker" \
              "🟡 **Necesito una decisión**" \
              "El ciclo de revisión-corrección ha dejado de converger tras ${rounds} ronda(s) registrada(s), así que me detengo en vez de seguir corrigiendo." \
              "Motivo (\`${reason}\`): ${detail}" >"$body_file"
            sirius_transition "$GH_REPO" "$ISSUE_NUMBER" "$marker" "$body_file" \
              "sirius:blocked-decision" "D4C5F9" "Estado: requiere una decisión humana" \
              "noclose" "sirius:repair-requested" || echo "::error::No se pudo aplicar el bloqueo por convergencia."
            rm -f "$body_file"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t pr_numbers < <(sirius_find_pr_for_issue "$GH_REPO" "$ISSUE_NUMBER")
          if [ "${#pr_numbers[@]}" -ne 1 ]; then
            reason="sin-pr"
            why="No encuentro ninguna PR asociada a esta incidencia; no hay nada que corregir."
            if [ "${#pr_numbers[@]}" -gt 1 ]; then
              reason="varias-pr"
              why="Esta incidencia referencia varias PR distintas; me detengo para no corregir la equivocada."
            fi
            marker="<!-- sirius-verdict:corrector:precheck:${reason} -->"
            body_file="$(mktemp)"
            printf '%s\n\n%s\n\n%s\n' "$marker" "🔴 **Me he detenido de forma segura**" "$why" >"$body_file"
            sirius_transition "$GH_REPO" "$ISSUE_NUMBER" "$marker" "$body_file" \
              "sirius:failed-safely" "D93F0B" "Estado temporal: fallo operativo detenido de forma segura" \
              "noclose" "sirius:repair-requested" || echo "::error::No se pudo aplicar la parada segura (${reason})."
            rm -f "$body_file"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          observations="$(sirius_extract_observations "$GH_REPO" "$ISSUE_NUMBER")"
          if [ -z "$observations" ]; then
            marker="<!-- sirius-verdict:corrector:precheck:sin-observaciones -->"
            body_file="$(mktemp)"
            printf '%s\n\n%s\n\n%s\n' \
              "$marker" "🔴 **Me he detenido de forma segura**" \
              "No encuentro ninguna observación estructurada que corregir en esta incidencia." >"$body_file"
            sirius_transition "$GH_REPO" "$ISSUE_NUMBER" "$marker" "$body_file" \
              "sirius:failed-safely" "D93F0B" "Estado temporal: fallo operativo detenido de forma segura" \
              "noclose" "sirius:repair-requested" || echo "::error::No se pudo aplicar la parada segura (sin-observaciones)."
            rm -f "$body_file"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s' "$observations" > "${RUNNER_TEMP}/sirius_observations.json"
          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_numbers[0]}" >> "$GITHUB_OUTPUT"
          echo "cycle=${next_cycle}" >> "$GITHUB_OUTPUT"

      - name: Consumir el evento y marcar en curso
        if: steps.gate.outputs.valid == 'true'
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          source scripts/automation/sirius_issue.sh
          sirius_set_issue_labels "$GH_REPO" "$ISSUE_NUMBER" \
            "sirius:repairing" "sirius:repair-requested"

      - name: Preparar instrucciones para Claude Code
        if: steps.gate.outputs.valid == 'true'
        id: build_prompt
        shell: bash --noprofile --norc {0}
        env:
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          CYCLE: ${{ steps.gate.outputs.cycle }}
        run: |
          set -uo pipefail
          {
            echo "prompt<<SIRIUS_PROMPT_EOF"
            cat scripts/automation/prompts/corrector.md
            echo ""
            echo "## Contexto de esta ejecución"
            echo "- Repositorio: ${GH_REPO}"
            echo "- Incidencia de trabajo: #${ISSUE_NUMBER}"
            echo "- Pull Request a corregir: #${PR_NUMBER}"
            echo "- Ronda de corrección: ${CYCLE}. No hay un tope fijo de rondas: el ciclo continúa mientras haya progreso comprobable y se detiene en cuanto deja de haberlo."
            echo "- Las observaciones estructuradas están en la ruta exacta de la variable de entorno SIRIUS_OBSERVATIONS_FILE."
            echo "- El archivo de veredicto debe escribirse en la ruta exacta de la variable de entorno SIRIUS_VERDICT_FILE."
            echo "SIRIUS_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ejecutar Claude Code (corrector)
        if: steps.gate.outputs.valid == 'true'
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.SIRIUS_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          SIRIUS_OBSERVATIONS_FILE: ${{ runner.temp }}/sirius_observations.json
          SIRIUS_VERDICT_FILE: ${{ runner.temp }}/sirius_verdict.json
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Mismo PAT que el checkout: el push de la corrección debe provenir de
          # una identidad real para que `synchronize` vuelva a disparar Quality.
          github_token: ${{ secrets.SIRIUS_BOT_TOKEN }}
          prompt: ${{ steps.build_prompt.outputs.prompt }}
          claude_args: '--dangerously-skip-permissions --allowedTools "Bash,Read,Write,Edit,Grep,Glob" --max-turns 120'

      - name: Aplicar el veredicto
        if: always() && steps.gate.outputs.valid == 'true'
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CYCLE: ${{ steps.gate.outputs.cycle }}
        run: |
          set -uo pipefail
          bash scripts/automation/sirius_apply_verdict.sh \
            "$GH_REPO" "$ISSUE_NUMBER" "corrector" "${RUNNER_TEMP}/sirius_verdict.json" "$CYCLE"
