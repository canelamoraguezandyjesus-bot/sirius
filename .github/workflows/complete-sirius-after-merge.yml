name: Complete Sirius after merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: complete-sirius-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  complete:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Complete matching Sirius work item
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          mapfile -t issue_numbers < <(
            gh issue list \
              --repo "$GH_REPO" \
              --state open \
              --limit 100 \
              --search "\"${PR_URL}\" in:body" \
              --json number,labels \
              --jq '.[] | select(any(.labels[]?; .name | startswith("sirius:"))) | .number'
          )

          if [ "${#issue_numbers[@]}" -eq 0 ]; then
            echo "No open Sirius work item references PR #${PR_NUMBER}."
            exit 0
          fi

          if [ "${#issue_numbers[@]}" -ne 1 ]; then
            for issue_number in "${issue_numbers[@]}"; do
              gh issue comment "$issue_number" --repo "$GH_REPO" --body "<!-- sirius-completed:${MERGE_SHA}:ambiguous -->

La PR #${PR_NUMBER} fue fusionada, pero existen varias incidencias Sirius abiertas que la referencian. El cierre automático se detiene para evitar completar la incidencia equivocada.

- Merge SHA: \`${MERGE_SHA}\`"
              gh issue edit "$issue_number" --repo "$GH_REPO" --add-label "sirius:failed-safely"
            done
            exit 1
          fi

          issue_number="${issue_numbers[0]}"

          for label in \
            sirius:planned \
            sirius:implement-requested \
            sirius:implementing \
            sirius:ci-pending \
            sirius:review-requested \
            sirius:reviewing \
            sirius:repair-requested \
            sirius:repairing \
            sirius:ready-for-merge \
            sirius:blocked-decision \
            sirius:failed-safely; do
            gh issue edit "$issue_number" --repo "$GH_REPO" --remove-label "$label" 2>/dev/null || true
          done

          gh issue comment "$issue_number" --repo "$GH_REPO" --body "<!-- sirius-completed:${MERGE_SHA} -->

## SIRIUS_COMPLETED

- PR: ${PR_URL}
- Merge SHA: \`${MERGE_SHA}\`
- Resultado: bloque fusionado y completado."
          gh issue edit "$issue_number" --repo "$GH_REPO" --add-label "sirius:completed"
          gh issue close "$issue_number" --repo "$GH_REPO" --reason completed