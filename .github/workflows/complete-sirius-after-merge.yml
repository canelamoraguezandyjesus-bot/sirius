name: Complete Sirius after merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: complete-sirius-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  complete:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Complete matching Sirius work item
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          # Garantiza que una etiqueta terminal exista antes de aplicarla, sin depender
          # de que el workflow de bootstrap haya terminado. Es idempotente: si existe,
          # actualiza color y descripcion; si no, la crea.
          ensure_label() {
            name="$1"
            color="$2"
            description="$3"
            if gh label view "$name" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh label edit "$name" --repo "$GH_REPO" --color "$color" --description "$description"
            else
              gh label create "$name" --repo "$GH_REPO" --color "$color" --description "$description"
            fi
          }

          # Localizar incidencias Sirius abiertas que referencien la PR en el cuerpo
          # o en cualquiera de sus comentarios. La Routine implementadora suele
          # registrar la URL en un comentario, no en el body, y la busqueda indexada
          # puede retrasarse, asi que listamos las candidatas por etiqueta y leemos
          # body y comments directamente.
          mapfile -t candidate_issues < <(
            gh issue list \
              --repo "$GH_REPO" \
              --state open \
              --limit 100 \
              --json number,labels \
              --jq '.[] | select(any(.labels[]?; .name | startswith("sirius:"))) | .number'
          )

          matched_issues=()
          for issue_number in "${candidate_issues[@]}"; do
            issue_json="$(gh issue view "$issue_number" --repo "$GH_REPO" --json body,comments)"
            if printf '%s' "$issue_json" \
              | jq -r '[.body] + [.comments[].body] | map(select(. != null)) | .[]' \
              | grep -oE 'https://github\.com/[^/[:space:]]+/[^/[:space:]]+/pull/[0-9]+' \
              | grep -Fxq "$PR_URL"; then
              matched_issues+=("$issue_number")
            fi
          done

          if [ "${#matched_issues[@]}" -eq 0 ]; then
            echo "No open Sirius work item references PR #${PR_NUMBER}."
            exit 0
          fi

          if [ "${#matched_issues[@]}" -ne 1 ]; then
            ensure_label "sirius:failed-safely" "D93F0B" "Estado temporal: fallo operativo detenido de forma segura"
            for issue_number in "${matched_issues[@]}"; do
              marker="<!-- sirius-completed:${MERGE_SHA}:ambiguous -->"
              if gh issue view "$issue_number" --repo "$GH_REPO" --json comments --jq '.comments[].body' | grep -Fq "$marker"; then
                echo "Ambiguity already reported on issue #${issue_number} for ${MERGE_SHA}."
              else
                comment_body="$(printf '%s\n\n%s\n\n%s\n' \
                  "${marker}" \
                  "La PR #${PR_NUMBER} fue fusionada, pero existen varias incidencias Sirius abiertas que la referencian. El cierre automatico se detiene para evitar completar la incidencia equivocada." \
                  "- Merge SHA: \`${MERGE_SHA}\`")"
                gh issue comment "$issue_number" --repo "$GH_REPO" --body "$comment_body"
              fi
              gh issue edit "$issue_number" --repo "$GH_REPO" --add-label "sirius:failed-safely"
            done
            exit 1
          fi

          issue_number="${matched_issues[0]}"

          marker="<!-- sirius-completed:${MERGE_SHA} -->"
          if gh issue view "$issue_number" --repo "$GH_REPO" --json comments --jq '.comments[].body' | grep -Fq "$marker"; then
            echo "Completion already recorded for issue #${issue_number} at ${MERGE_SHA}."
            exit 0
          fi

          for label in \
            sirius:planned \
            sirius:implement-requested \
            sirius:implementing \
            sirius:ci-pending \
            sirius:review-requested \
            sirius:reviewing \
            sirius:repair-requested \
            sirius:repairing \
            sirius:ready-for-merge \
            sirius:blocked-decision \
            sirius:failed-safely; do
            gh issue edit "$issue_number" --repo "$GH_REPO" --remove-label "$label" 2>/dev/null || true
          done

          comment_body="$(printf '%s\n\n%s\n\n%s\n%s\n%s\n' \
            "${marker}" \
            "## SIRIUS_COMPLETED" \
            "- PR: ${PR_URL}" \
            "- Merge SHA: \`${MERGE_SHA}\`" \
            "- Resultado: bloque fusionado y completado.")"
          gh issue comment "$issue_number" --repo "$GH_REPO" --body "$comment_body"
          ensure_label "sirius:completed" "006B75" "Estado terminal: bloque fusionado y cerrado"
          gh issue edit "$issue_number" --repo "$GH_REPO" --add-label "sirius:completed"
          gh issue close "$issue_number" --repo "$GH_REPO" --reason completed
