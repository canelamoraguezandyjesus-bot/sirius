name: Notificar estado de Sirius

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: notify-sirius-${{ github.event.issue.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  notify:
    name: Publicar notificación de estado
    if: >-
      github.event.label.name == 'sirius:implementing' ||
      github.event.label.name == 'sirius:repair-requested' ||
      github.event.label.name == 'sirius:ready-for-merge' ||
      github.event.label.name == 'sirius:blocked-decision' ||
      github.event.label.name == 'sirius:failed-safely' ||
      github.event.label.name == 'sirius:completed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publicar notificación de estado
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATE_LABEL: ${{ github.event.label.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -u
          set -o pipefail

          # Este workflow es secundario: nunca debe romper ni bloquear el flujo
          # principal de Sirius. Ante cualquier problema para leer la incidencia,
          # resolver el propietario o publicar el comentario, se deja un aviso en los
          # logs y se termina con exito, sin alterar el estado de la incidencia. Por eso
          # no se usa "set -e": un fallo secundario no debe convertirse en una ejecucion
          # roja que a su vez genere otra notificacion tecnica.

          if [ -z "${REPOSITORY_OWNER:-}" ]; then
            echo "::warning::No se pudo resolver el propietario del repositorio; se omite la notificacion sin alterar el flujo principal."
            exit 0
          fi

          issue_json="$(gh issue view "$ISSUE_NUMBER" --repo "$GH_REPO" --json body,comments 2>/dev/null)"
          if [ -z "$issue_json" ]; then
            echo "::warning::No se pudo obtener la incidencia #${ISSUE_NUMBER}; se omite la notificacion sin alterar el flujo principal."
            exit 0
          fi

          # Busqueda robusta del Head SHA / Merge SHA: primero en los comentarios mas
          # recientes y despues en el cuerpo. Acepta SHA de 7 a 40 caracteres hex, no
          # depende de expresiones jq fragiles y no falla si no encuentra ninguno ni si
          # algun comentario no contiene SHA.
          scan_text="$(printf '%s' "$issue_json" | jq -r '((.comments // []) | reverse | map(.body // "")) + [(.body // "")] | .[]' 2>/dev/null)"
          head_sha="$(printf '%s\n' "$scan_text" | sed -nE 's/.*(Head|Merge) SHA:[[:space:]]*`?([0-9a-fA-F]{7,40}).*/\2/p' | head -n 1)"
          if [ -z "${head_sha:-}" ]; then
            head_sha="no-head"
          fi

          # Idempotencia: un marcador oculto estable por estado y version del trabajo
          # garantiza una sola notificacion por incidencia y SHA relevante.
          marker="<!-- sirius-notification:${STATE_LABEL}:${head_sha} -->"
          existing="$(printf '%s' "$issue_json" | jq -r '.comments[]?.body // empty' 2>/dev/null)"
          if printf '%s' "$existing" | grep -Fq "$marker"; then
            echo "La notificacion para ${STATE_LABEL} (${head_sha}) ya existe; no se duplica."
            exit 0
          fi

          titulo=""
          cuerpo=""
          case "$STATE_LABEL" in
            sirius:implementing)
              titulo="🟦 **Sirius ha empezado a trabajar**"
              cuerpo=$'He comenzado el bloque asociado a esta incidencia.\n\nNo necesitas hacer nada por ahora.'
              ;;
            sirius:repair-requested)
              titulo="🟠 **He encontrado un problema corregible**"
              cuerpo=$'Una comprobación automática ha fallado.\n\nVoy a intentar corregir únicamente la causa detectada y volveré a ejecutar las comprobaciones.\n\nNo necesitas intervenir por ahora.'
              ;;
            sirius:ready-for-merge)
              titulo="🟢 **El trabajo está listo**"
              cuerpo=$'La implementación, las comprobaciones y la revisión han terminado correctamente.\n\nSolo falta tu autorización para fusionarlo.\n\nEscribe **Fusiona** en ChatGPT para continuar.'
              ;;
            sirius:blocked-decision)
              titulo="🟡 **Necesito una decisión**"
              cuerpo=$'El trabajo se ha detenido porque existe una decisión que no puedo tomar automáticamente.\n\nRevisa la incidencia y responde en ChatGPT.'
              ;;
            sirius:failed-safely)
              titulo="🔴 **Me he detenido de forma segura**"
              cuerpo=$'He encontrado un problema que no puedo resolver automáticamente sin riesgo.\n\nLa incidencia contiene el diagnóstico y el siguiente paso recomendado.'
              ;;
            sirius:completed)
              titulo="✅ **Trabajo terminado**"
              cuerpo=$'El bloque se ha fusionado e integrado correctamente.\n\nNo se iniciará otro bloque hasta que el usuario lo ordene.'
              ;;
            *)
              echo "::warning::El estado ${STATE_LABEL} no es notificable; no se realiza ninguna accion."
              exit 0
              ;;
          esac

          # Una unica mencion al propietario para que la notificacion llegue de verdad.
          comment_body="$(printf '%s\n\n%s\n\n%s\n\n%s\n' "$marker" "$titulo" "$cuerpo" "@${REPOSITORY_OWNER}")"

          if ! gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "$comment_body"; then
            echo "::warning::No se pudo publicar la notificacion en la incidencia #${ISSUE_NUMBER}; el flujo principal continua sin cambios."
            exit 0
          fi

          echo "Notificacion publicada para ${STATE_LABEL} (${head_sha})."
          exit 0
