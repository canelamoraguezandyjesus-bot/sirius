name: Notificar estado de Sirius

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

# Una ranura por EVENTO, no por etiqueta (ADR-158). Actions guarda como mucho
# UNA ejecucion en espera por grupo y descarta la pendiente cuando llega otra,
# incluso con cancel-in-progress: false: con el grupo anterior
# (incidencia+etiqueta) un tercer evento de la misma etiqueta desplazaba al
# segundo antes de que publicara, y ese suceso no dejaba marcador -el mismo
# agujero que ADR-157 vino a cerrar, por otra puerta-. Al incluir el run, dos
# eventos distintos no comparten ranura y ninguno puede descartar a otro;
# reejecutar el MISMO run sigue cayendo en el mismo grupo, y su marcador
# -que lleva ese run desde ADR-157- sigue deduplicando.
concurrency:
  group: notify-sirius-${{ github.event.issue.number }}-${{ github.event.label.name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    name: Publicar notificación de estado
    if: >-
      github.event.label.name == 'sirius:implementing' ||
      github.event.label.name == 'sirius:repair-requested' ||
      github.event.label.name == 'sirius:ready-for-merge' ||
      github.event.label.name == 'sirius:blocked-decision' ||
      github.event.label.name == 'sirius:failed-safely' ||
      github.event.label.name == 'sirius:completed'
    runs-on: ubuntu-latest
    # Sube de 5 a 8 desde ADR-175: el paso del tablero monta `uv` y sincroniza
    # el entorno. Con la caché de `setup-uv` eso son segundos -medido en
    # `reflejar-desenlace.yml`: instalar 2 s, sincronizar 3 s-, pero una caché
    # fría descarga las dependencias de ejecución y no cabía en el plazo
    # anterior. El plazo sigue siendo una red de seguridad de un workflow
    # secundario, no una garantía de la que dependa nada del ciclo.
    timeout-minutes: 8
    steps:
      - name: Checkout automation library
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Publicar notificación de estado
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATE_LABEL: ${{ github.event.label.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -u
          set -o pipefail
          source scripts/automation/sirius_issue.sh

          # Este workflow es secundario: nunca debe romper ni bloquear el flujo
          # principal de Sirius. Ante cualquier problema para leer la incidencia,
          # resolver el propietario o publicar el comentario, se deja un aviso en los
          # logs y se termina con exito, sin alterar el estado de la incidencia. Por
          # eso no se usa "set -e".

          if [ -z "${REPOSITORY_OWNER:-}" ]; then
            echo "::warning::No se pudo resolver el propietario del repositorio; se omite la notificacion sin alterar el flujo principal."
            exit 0
          fi

          # Head/Merge SHA: escaneo robusto (REST con respaldo GraphQL) de los
          # comentarios mas recientes y despues el cuerpo. Si no hay SHA se usa un
          # identificador estable "no-head" para no repetir notificaciones.
          scan_file="$(mktemp)"
          sirius_scan_text "$GH_REPO" "$ISSUE_NUMBER" "$scan_file"
          head_sha="$(sirius_extract_sha "$scan_file")"
          rm -f "$scan_file"

          # Idempotencia: una sola notificacion por EVENTO de etiqueta, no por
          # estado y SHA (ADR-157). El marcador lleva el run que atiende el
          # evento, asi que reejecutar ESTE run no publica un segundo aviso -el
          # run no cambia al reintentar- pero dos paradas distintas del mismo
          # estado sobre el mismo head dejan cada una el suyo. Con el marcador
          # anterior (`<etiqueta>:<head>`) la segunda no dejaba ningun rastro y
          # el historial de la incidencia guardaba una ocurrencia donde hubo
          # dos: cinco rondas de #545 se fueron en adivinar lo que este
          # workflow habia borrado al publicar.
          marker="<!-- sirius-notification:${STATE_LABEL}:${head_sha}:${RUN_ID:-sin-run} -->"
          existing="$(sirius_read_issue_comments "$GH_REPO" "$ISSUE_NUMBER" 2>/dev/null || true)"
          if printf '%s' "$existing" | grep -Fq "$marker"; then
            echo "La notificacion para ${STATE_LABEL} (${head_sha}) ya existe; no se duplica."
            exit 0
          fi

          titulo=""
          cuerpo=""
          case "$STATE_LABEL" in
            sirius:implementing)
              titulo="🟦 **Sirius ha empezado a trabajar**"
              cuerpo=$'He comenzado el bloque asociado a esta incidencia.\n\nNo necesitas hacer nada por ahora.'
              ;;
            sirius:repair-requested)
              titulo="🟠 **He encontrado un problema corregible**"
              cuerpo=$'Una comprobación automática o la revisión independiente ha encontrado defectos concretos.\n\nVoy a intentar corregir únicamente lo señalado y volveré a ejecutar las comprobaciones.\n\nNo necesitas intervenir por ahora.'
              ;;
            sirius:ready-for-merge)
              titulo="🟢 **El trabajo está listo**"
              cuerpo=$'La implementación, las comprobaciones y la revisión han terminado correctamente.\n\nSolo falta tu autorización para fusionarlo.\n\nEscribe **fusiona** en un comentario de esta incidencia para fusionarlo automáticamente.'
              ;;
            sirius:blocked-decision)
              titulo="🟡 **Necesito una decisión**"
              cuerpo=$'El trabajo se ha detenido porque existe una decisión que no puedo tomar automáticamente.\n\nRevisa la incidencia y decide el siguiente paso directamente aquí.'
              ;;
            sirius:failed-safely)
              titulo="🔴 **Me he detenido de forma segura**"
              cuerpo=$'He encontrado un problema que no puedo resolver automáticamente sin riesgo.\n\nLa incidencia contiene el diagnóstico y el siguiente paso recomendado.'
              ;;
            sirius:completed)
              titulo="✅ **Trabajo terminado**"
              cuerpo=$'El bloque se ha fusionado e integrado correctamente.\n\nNo se iniciará otro bloque hasta que el usuario lo ordene.'
              ;;
            *)
              echo "::warning::El estado ${STATE_LABEL} no es notificable; no se realiza ninguna accion."
              exit 0
              ;;
          esac

          # Una unica mencion al propietario para que la notificacion llegue de verdad.
          comment_body="$(printf '%s\n\n%s\n\n%s\n\n%s\n' "$marker" "$titulo" "$cuerpo" "@${REPOSITORY_OWNER}")"

          if ! sirius_retry gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "$comment_body"; then
            echo "::warning::No se pudo publicar la notificacion en la incidencia #${ISSUE_NUMBER}; el flujo principal continua sin cambios."
            exit 0
          fi

          echo "Notificacion publicada para ${STATE_LABEL} (${head_sha})."
          exit 0

      # --- El tablero de la incidencia (ADR-175) ------------------------------
      #
      # Un solo comentario con la foto de AHORA, reescrito en cada cambio de
      # estado. Las 40 incidencias más recientes del ciclo acumulan 1.019
      # comentarios -mediana 21, máximo 157- y ninguno dice el estado: son
      # hechos, publicados una vez y nunca vueltos a tocar. El historial no se
      # toca; esto se añade al lado.
      #
      # Va aquí y no en `reflejar-desenlace.yml` -que ya lee el espejo de cada
      # encargo y ya monta `uv`- porque ese workflow declara en su cabecera
      # «Sin `issues: write`: este comando solo LEE el espejo por `gh`». Esa
      # frontera la puso alguien a propósito y no se cruza para ahorrar cinco
      # segundos de instalación. Aquí no hace falta cruzarla: este workflow ya
      # escribe comentarios en esta misma incidencia, en este mismo evento, con
      # este mismo permiso.
      - name: Preparar el motor para el tablero
        continue-on-error: true
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          # Igual que en el resto: con el `python3` del sistema (3.12 en
          # `ubuntu-latest`) el paquete, que exige >=3.14, no arranca.
          python-version: "3.14.6"

      - name: Mantener el tablero de la incidencia al día
        # `always()` porque el paso de arriba lleva `continue-on-error` y porque
        # el aviso de estado y el tablero son independientes: que uno no salga
        # no es razón para saltarse el otro.
        if: always()
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -u
          set -o pipefail

          # Secundario, igual que el aviso: ante CUALQUIER problema se deja un
          # aviso en el log y se sale en verde. Un tablero que no se pudo pintar
          # no altera el estado de la incidencia ni bloquea el ciclo.
          if ! command -v uv >/dev/null 2>&1; then
            echo "::warning::uv no disponible; esta pasada no actualiza el tablero."
            exit 0
          fi
          if ! uv sync --locked >/dev/null 2>&1; then
            echo "::warning::no se pudo preparar el entorno; esta pasada no actualiza el tablero."
            exit 0
          fi

          source scripts/automation/sirius_issue.sh

          cuerpo="$(mktemp)"
          if ! uv run sirius-tablero --repo "$GH_REPO" --incidencia "$ISSUE_NUMBER" > "$cuerpo"; then
            rm -f "$cuerpo"
            echo "::warning::no se pudo calcular el tablero de #${ISSUE_NUMBER}; se deja como estaba."
            exit 0
          fi

          # El marcador se toma de la PRIMERA LÍNEA del propio cuerpo, que el
          # generador garantiza y `tests/engine/test_tablero.py` fija. Copiarlo
          # aquí sería el mismo dato en dos sitios, y el día que cambiara en uno
          # el motor publicaría un tablero nuevo dejando huérfano al anterior.
          marcador="$(sed -n '1p' "$cuerpo")"
          case "$marcador" in
            "<!--"*"-->") ;;
            *)
              rm -f "$cuerpo"
              echo "::warning::el tablero no empieza por su marcador; no publico a ciegas."
              exit 0
              ;;
          esac

          if ! sirius_comment_upsert "$GH_REPO" "$ISSUE_NUMBER" "$marcador" "$cuerpo"; then
            echo "::warning::no se pudo publicar el tablero de #${ISSUE_NUMBER}; el flujo principal continua."
          fi
          rm -f "$cuerpo"
          exit 0
