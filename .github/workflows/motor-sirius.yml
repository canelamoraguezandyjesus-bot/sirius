name: Motor de Sirius

# El turno del motor: reconciliar el mundo, cerrar como perdido lo que se perdió,
# reactivar o sustituir, y escalar lo que no se puede salvar. Autorizado por
# ADR-082 (decisión I4 del propietario en #270) y por la cláusula ampliada de
# `docs/evolution/STATUS.md`.
#
# POR QUÉ ES UN WORKFLOW PROPIO Y NO UN PASO DE LOS QUE YA HAY. Los workflows que
# llevan el ciclo se serializan POR INCIDENCIA o POR PR -así deben ser: dos
# encargos distintos avanzan a la vez-, y el motor necesita lo contrario, un
# grupo GLOBAL, porque su diario es uno solo. Esos dos requisitos no caben en el
# mismo fichero, y por eso este existe.
#
# Corrección del 24-08-2026, contada porque este comentario decía otra cosa: NO
# es verdad que «los doce grupos del ciclo sean por incidencia o por PR». Contado:
# de los doce, nueve lo son, uno va por SHA (`advance-sirius-after-quality`) y
# DOS son constantes globales (`bootstrap-sirius-automation-labels` y
# `reconcile-sirius-states`). Este último es además un contraejemplo directo a la
# frase «no caben juntos»: combina grupo global constante con
# `cancel-in-progress: false`. La decisión no cambia -los workflows del CICLO
# siguen siendo por incidencia-, pero el censo que la sostenía era falso.
#
# LO QUE PROTEGE EL BLOQUE `concurrency` DE ABAJO, y no es teoría: está medido en
# `tests/engine/test_exclusion_entre_invocaciones.py`. El almacén reproduce su
# diario una sola vez, al construirse, así que una invocación ya arrancada es
# ciega a todo lo que ocurra después: dos que arranquen antes de que ninguna
# grabe crean el mismo trabajo dos veces, con la misma clave de idempotencia y el
# mismo número de secuencia.
#
# Ojo con lo que ESTE workflow arriesga y lo que no. La medición llega hasta «DOS
# incidencias y DOS etiquetas para una sola petición», pero eso lo produce el
# DESPACHADOR, que aquí no corre: `sirius-supervisar` llama a `supervise_runs`
# sin ningún escritor, y el bloque `permissions` de abajo no lleva
# `issues: write`. Lo que este fichero puede corromper es el diario. Serializar
# no es una
# precaución: es lo único que lo impide.
#
# `cancel-in-progress: false` a propósito: cancelar la invocación que va no
# protege el diario, lo deja a medias. Se espera, no se mata. Y el grupo es una
# CONSTANTE: uno que variara por evento metería cada invocación en un grupo
# distinto y la protección sería decorativa.
# `tests/automation/test_serializacion_del_motor.py` rompe si algo de esto se
# afloja.
#
# CON HORARIO DESDE EL 25-08-2026 (D2, ADR-090). La cautela de antes decía:
# «un motor que empieza a correr solo antes de que nadie le haya visto dar un
# turno es cómo se rompen las cosas de madrugada». Ya se le ha visto: dio turnos
# a mano, su camino de escritura está probado por ejecución (ADR-083) y su
# diario dejó de estar vacío cuando el despachador anotó su primer encargo
# (ADR-086).
#
# LA CADENCIA, Y POR QUÉ ESE MINUTO. `reconcile-sirius-states` barre estados
# atascados a `17 */6 * * *`. El motor corre TREINTA MINUTOS DESPUÉS, a
# `47 */6 * * *`, y el desfase no es estético: el reconciliador repara estados
# que ningún evento puede ya revivir, así que dejarle asentar el mundo antes de
# que el motor lo mire evita que el motor razone sobre un estado que está a
# punto de cambiar. Primero se asienta, luego se supervisa.
#
# NO COMPARTEN CANDADO, Y NO HACE FALTA: son grupos de concurrencia distintos,
# pero no escriben lo mismo. El reconciliador escribe ETIQUETAS; el motor
# escribe SU DIARIO, y no lleva `issues: write` -ver el bloque `permissions`-.
# Lo que sí comparte candado el motor es el despachador (ADR-086), porque esos
# dos sí escriben el mismo diario.
#
# CADA SEIS HORAS Y NO MÁS: hoy el diario tiene un encargo. El valor de un turno
# es proporcional al trabajo en vuelo, y subir la frecuencia antes de tener ese
# trabajo es gastar minutos de Actions en mirar un mundo quieto. Se sube cuando
# haya algo que mirar, no antes.

on:
  # Treinta minutos después del reconciliador (`17 */6 * * *`), a propósito:
  # que asiente el mundo antes de que el motor lo mire. Ver la cabecera.
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      ensayo:
        description: "Solo resolver y decir qué usaría, sin supervisar nada"
        type: boolean
        default: true

concurrency:
  group: motor-sirius
  cancel-in-progress: false

# MÍNIMOS, y medidos: `supervise_runs` no escribe en GitHub -no recibe ningún
# escritor: solo almacén, observador y sus diarios-. Lee el estado de los runs
# por la API (`actions: read`) y confirma su memoria en el repositorio
# (`contents: write`). No necesita `issues: write` ni el token del bot, y por eso
# no los lleva: el día que los necesite será una decisión, no un descuido.
permissions:
  contents: write
  actions: read

jobs:
  turno:
    name: Un turno del motor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      #: La rama donde vive la memoria del motor. Constante a proposito: es la
      #: misma para todas las invocaciones, igual que el grupo de concurrencia.
      RAMA_MEMORIA: estado-del-motor
      # `MEMORIA` NO se declara aqui, y las dos formas de intentarlo fallan:
      #   `${{ runner.temp }}` -> ese contexto no existe cuando GitHub lee el
      #     `env:` de un trabajo, y el fichero entero se vuelve ilegible
      #     ("Unrecognized named-value: 'runner'"). Costo que el motor dejara
      #     de arrancar el 24-08-2026.
      #   `${RUNNER_TEMP}`     -> GitHub no expande eso, y bash tampoco expande
      #     el CONTENIDO de una variable: quedaria la ruta literal con el dolar
      #     dentro. Peor, porque parece correcto y falla en ejecucion.
      # Se calcula en el primer paso y se publica por `$GITHUB_ENV`, que es
      # donde `$RUNNER_TEMP` si esta resuelto.

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # El motor confirma su diario, así que necesita credenciales que
          # persistan para el `git push` del final.
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          # El paquete exige `>=3.14,<3.15`. Un workflow que invoque al motor
          # con el `python3` del sistema (3.12 en `ubuntu-latest`) no lo
          # arranca: es la misma familia que costó H-13.
          python-version: "3.14.6"

      - name: Sync environment
        run: uv sync --locked --all-groups

      # La memoria del motor NO vive en `main`, y no es un capricho de orden.
      #
      # `main` esta protegido: exige pull request. Un `git push` directo desde
      # aqui se rechaza, y el primer turno en el servidor lo tapo -salio antes
      # de empujar porque no habia nada que anotar, asi que el rechazo nunca
      # llego a ocurrir y la ejecucion salio en verde-.
      #
      # Meter al motor en la lista de excepciones del ruleset habria abierto un
      # agujero permanente en esa proteccion. Su propia rama no abre ninguno: el
      # ruleset apunta a la rama por defecto, y esta no lo es.
      #
      # Y de paso el historial de `main` deja de llenarse de apuntes de
      # contabilidad: el motor anota en cada turno, y eso es estado, no codigo.
      - name: Traer la memoria del motor
        env:
          # `env:` de PASO: aqui `runner` SI esta resuelto. Se declara en CADA
          # paso que la use en vez de publicarla por `$GITHUB_ENV`, porque esa
          # publicacion solo ocurre si este paso llega a correr, y el paso que
          # confirma lleva `if: always()`. Un `always()` que dependa de una
          # variable publicada por un paso `success()` es la regresion que este
          # mismo fichero introdujo al arreglar el fallo anterior.
          MEMORIA: ${{ runner.temp }}/memoria
        run: |
          set -uo pipefail
          git config user.name "sirius-motor"
          git config user.email "canelamoraguezandyjesus@gmail.com"

          # Se ramifica por el CODIGO de `ls-remote`, no por su signo, y su
          # stderr NO se tapa. Git distingue 2 -"el remoto contesto y la rama no
          # esta"- de 128 -"no pude hablar con el remoto"-, y colapsarlos crearia
          # una rama huerfana VACIA por un corte de red: el turno correria con el
          # diario en blanco y su anotacion se perderia al rechazarse el push.
          codigo=0
          git ls-remote --exit-code --heads origin "$RAMA_MEMORIA" >/dev/null || codigo=$?
          case "$codigo" in
            0)
              git fetch --depth=1 origin "$RAMA_MEMORIA"
              git worktree add "$MEMORIA" "origin/$RAMA_MEMORIA"
              ;;
            2)
              # Primer turno de la historia: la rama todavia no existe. Huerfana a
              # proposito -no comparte historia con `main` y no la arrastra-.
              echo "La rama $RAMA_MEMORIA no existe todavia; se crea vacia."
              git worktree add --orphan -b "$RAMA_MEMORIA" "$MEMORIA"
              ;;
            *)
              echo "::error::no se pudo consultar el remoto (ls-remote salio con $codigo)." >&2
              exit 1
              ;;
          esac

      - name: Dar el turno
        id: turno
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Aqui `runner` SI esta resuelto: es el `env:` de un paso, no de un trabajo.
          SIRIUS_MOTOR_DIARIO: ${{ runner.temp }}/memoria/diario.jsonl
          # UN TURNO PROGRAMADO ACTUA SIEMPRE, y hace falta decirlo aparte.
          # `inputs.ensayo` NO EXISTE en un evento `schedule`: se expande a la
          # cadena vacia, y `"" = "false"` es falso, asi que la comparacion sola
          # habria mandado TODOS los turnos programados por la rama del ensayo.
          # El motor correria cada seis horas para no hacer nada, en verde y para
          # siempre: el verde falso de siempre, esta vez cableado a proposito.
          # Por eso se decide por el EVENTO, no por un input que en ese evento no
          # esta.
          EVENTO: ${{ github.event_name }}
          ENSAYO_PEDIDO: ${{ inputs.ensayo }}
        run: |
          set -uo pipefail
          if [ "$EVENTO" = "schedule" ]; then
            echo "Turno programado: actua de verdad."
            uv run sirius-supervisar
          elif [ "$ENSAYO_PEDIDO" = "false" ]; then
            echo "Turno a mano con el interruptor puesto: actua de verdad."
            uv run sirius-supervisar
          else
            echo "Ensayo: no se supervisa nada."
            uv run sirius-supervisar --ensayo
          fi

      - name: Confirmar la memoria del motor
        # Se ejecuta aunque el turno falle: si el motor actuo y luego murio, su
        # diario ya tiene las lineas de lo que hizo y perderlas seria peor que
        # el propio fallo. Un turno sin cambios no confirma nada y no es error.
        if: always()
        env:
          MEMORIA: ${{ runner.temp }}/memoria
        run: |
          set -uo pipefail
          if [ ! -d "$MEMORIA" ]; then
            echo "No se llego a preparar la memoria; no hay nada que confirmar."
            exit 0
          fi
          cd "$MEMORIA"

          # Se mira el CODIGO de `git status`, no su salida. Una salida vacia
          # porque el comando reviento se leeria como "no hay cambios" y este
          # paso saldria en VERDE tirando el diario, que es justo lo contrario
          # de lo que su comentario promete. La regla ya esta escrita en esta
          # casa: una lectura vacia no significa "no hay nada", significa que no
          # se llego a mirar (`repair-sirius-work.yml`).
          if ! estado=$(git status --porcelain); then
            echo "::error::no se pudo leer el estado de la memoria; esto NO es un turno sin cambios." >&2
            exit 1
          fi
          if [ -z "$estado" ]; then
            echo "El motor no anoto nada en este turno."
            exit 0
          fi
          git add -A
          git commit -m "Motor: turno del $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Sin reintento ni rebase: el grupo de concurrencia garantiza que no
          # hay otra invocacion empujando a la vez. Si esto falla, es que esa
          # garantia no se cumplio, y eso hay que verlo en rojo -no taparlo con
          # un `pull --rebase` que ademas releeria un diario que el proceso ya
          # tiene cargado en memoria.
          git push origin "HEAD:refs/heads/$RAMA_MEMORIA"
