name: Quality (Windows)

# Validación PUNTUAL en Windows, solo bajo demanda (workflow_dispatch). El ciclo
# automático usa el Quality de Linux (más barato y rápido); esto se ejecuta a
# mano antes de un hito o una entrega para cubrir regresiones específicas de
# Windows. NO participa en la cadena de automatización: `advance-sirius-after-quality`
# se ancla al workflow "Quality" (Linux) y el merge comprueba el check "quality";
# este job se llama distinto (`quality-windows`) a propósito para no interferir.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.14.6"

      - name: Sync environment
        run: uv sync --locked --all-groups

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src tests

      - name: Pytest
        run: uv run pytest
