name: Mantener el tablero de la incidencia

# Un SOLO comentario por incidencia con la foto de AHORA, reescrito en cada
# cambio de estado (ADR-175). Las 40 incidencias más recientes del ciclo
# acumulan 1.019 comentarios -mediana 21, máximo 157- y ninguno dice el estado:
# cada uno es un HECHO con su marcador, publicado una vez y nunca vuelto a
# tocar. El historial no se toca; esto se pone al lado.
#
# POR QUÉ ES UN WORKFLOW APARTE y no un paso más de `notify-sirius-state.yml`,
# que se dispara con las mismas seis etiquetas y ya tiene `issues: write`:
# porque los dos necesitan `concurrency` OPUESTAS, y compartir fichero
# obligaría a uno de los dos a aceptar la del otro.
#
# - El aviso publica un HECHO. Necesita una ranura POR EVENTO (ADR-158): Actions
#   guarda como mucho UNA ejecución en espera por grupo y descarta la pendiente
#   cuando llega otra, así que con un grupo compartido un tercer evento
#   desplazaría al segundo y ese hecho no dejaría marcador. Un hecho perdido no
#   se recupera.
# - El tablero publica un ESTADO, recalculado entero del espejo en cada pasada,
#   así que descartar una pendiente no pierde nada... SIEMPRE QUE la que
#   sobrevive cubra también lo que la descartada iba a hacer. Ese "siempre que"
#   faltaba en la primera versión y lo encontró la revisión del 12-09-2026: con
#   un grupo común, si A está corriendo, B espera y llega C, Actions descarta B
#   —y B era OTRA incidencia—, así que su tablero se quedaba viejo sin que nada
#   volviera a tocarlo. Por eso cada pasada no refresca solo su incidencia:
#   refresca también las últimas movidas del ciclo (ver el paso de abajo). Una
#   incidencia cuyo evento se descartó es, por construcción, de las últimas
#   movidas, así que la siguiente pasada la recoge.
#
# Y el grupo tiene que ser CONSTANTE por otra razón, que es una regla del
# repositorio y no una preferencia: `tests/automation/test_serializacion_del_motor.py`
# exige que todo trabajo que invoque un comando del motor se serialice con un
# grupo constante (ADR-082). `sirius-tablero` solo LEE el espejo -no abre el
# diario, no despacha, no muta nada-, pero la guarda no distingue, y hace bien
# en no distinguir: la protección vale lo que vale su regla más simple.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: tablero-sirius
  cancel-in-progress: false

jobs:
  tablero:
    name: Reescribir el tablero de la incidencia
    # Las mismas seis etiquetas que notifica `notify-sirius-state.yml`. No se
    # amplía a `sirius:ci-pending` ni al resto: ampliar el disparador es cambiar
    # cuándo corre un workflow, y eso tiene su puerta en el contrato operativo.
    # En esa ventana el tablero enseña el estado anterior, y queda dicho.
    if: >-
      github.event.label.name == 'sirius:implementing' ||
      github.event.label.name == 'sirius:repair-requested' ||
      github.event.label.name == 'sirius:ready-for-merge' ||
      github.event.label.name == 'sirius:blocked-decision' ||
      github.event.label.name == 'sirius:failed-safely' ||
      github.event.label.name == 'sirius:completed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Install uv
        continue-on-error: true
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          # Igual que en el resto de workflows del motor: con el `python3` del
          # sistema (3.12 en `ubuntu-latest`) el paquete, que exige >=3.14, no
          # arranca. Es la familia de H-13.
          python-version: "3.14.6"

      - name: Reescribir el tablero
        # `always()` porque el paso de arriba lleva `continue-on-error`: si `uv`
        # no se pudo instalar, este paso lo dice y sale en verde en vez de dejar
        # el trabajo en un estado que nadie mira.
        if: always()
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -u
          set -o pipefail

          # Secundario de principio a fin: ante CUALQUIER problema se deja un
          # aviso en el registro y se sale en verde. Un tablero que no se pudo
          # pintar no altera el estado de la incidencia ni bloquea el ciclo, y
          # el anterior se queda donde está, que es mejor que pisarlo.
          if ! command -v uv >/dev/null 2>&1; then
            echo "::warning::uv no disponible; esta pasada no actualiza el tablero."
            exit 0
          fi
          if ! uv sync --locked >/dev/null 2>&1; then
            echo "::warning::no se pudo preparar el entorno; esta pasada no actualiza el tablero."
            exit 0
          fi

          source scripts/automation/sirius_issue.sh

          # QUÉ INCIDENCIAS SE REFRESCAN, y por qué no solo la del evento.
          #
          # El grupo de concurrencia es común a todo el repositorio (ver la
          # cabecera), y Actions guarda como mucho UNA ejecución en espera por
          # grupo: con tres eventos seguidos de incidencias distintas, la de en
          # medio se descarta y su tablero se quedaría viejo para siempre.
          #
          # Se arregla cubriendo, en cada pasada, un SUPERCONJUNTO que contiene
          # a la descartada: la incidencia del evento más las últimas movidas
          # DEL CICLO. Una incidencia cuyo evento se descartó acaba de recibir
          # una etiqueta -eso la mueve al principio de la lista por `updated`-,
          # así que la siguiente pasada la recoge, esté abierta o cerrada.
          #
          # Se PIDEN 100 y se recortan a 20 DESPUÉS de filtrar, no antes, y esa
          # diferencia es el arreglo de la segunda ronda de revisión: pidiendo
          # 20 en crudo, el filtro se aplicaba sobre una lista que ya venía
          # recortada, así que 20 PR recién tocadas dejaban CERO incidencias del
          # ciclo y la descartada no se recogía nunca. Ahora hacen falta 20
          # incidencias DEL CICLO movidas más recientemente para perder una, y
          # eso a este ritmo -unos pocos encargos vivos- no se alcanza. No es
          # una cola de pendientes: es una cota, y queda dicha.
          recientes="$(sirius_retry _sirius_gh api \
            "repos/${GH_REPO}/issues?state=all&sort=updated&direction=desc&per_page=100" \
            --jq '.[] | select(has("pull_request") | not)
                      | select([.labels[].name] | any(. == "sirius:implementing"
                          or . == "sirius:repair-requested" or . == "sirius:ready-for-merge"
                          or . == "sirius:blocked-decision" or . == "sirius:failed-safely"
                          or . == "sirius:completed"))
                      | .number' 2>/dev/null | head -n 20)" || recientes=""
          if [ -z "$recientes" ]; then
            echo "::warning::no pude listar las incidencias recientes; refresco solo la del evento."
          fi

          # La del evento SIEMPRE, aunque el listado fallara o ya no lleve
          # ninguna de las seis etiquetas (una etiqueta retirada también cambia
          # el estado que el tablero enseña).
          numeros="$(printf '%s\n%s\n' "$ISSUE_NUMBER" "$recientes" | awk 'NF && !vistos[$0]++')"

          fallos=0
          for numero in $numeros; do
            cuerpo="$(mktemp)"
            if ! uv run sirius-tablero --repo "$GH_REPO" --incidencia "$numero" > "$cuerpo"; then
              rm -f "$cuerpo"
              echo "::warning::no se pudo calcular el tablero de #${numero}; se deja como estaba."
              fallos=$((fallos + 1))
              continue
            fi

            # El marcador se toma de la PRIMERA LÍNEA del propio cuerpo, que el
            # generador garantiza y `tests/engine/test_tablero.py` fija.
            # Copiarlo aquí sería el mismo dato en dos sitios, y el día que
            # cambiara en uno el motor publicaría un tablero nuevo dejando
            # huérfano al anterior.
            marcador="$(sed -n '1p' "$cuerpo")"
            case "$marcador" in
              "<!--"*"-->") ;;
              *)
                rm -f "$cuerpo"
                echo "::warning::el tablero de #${numero} no empieza por su marcador; no publico a ciegas."
                fallos=$((fallos + 1))
                continue
                ;;
            esac

            if ! sirius_comment_upsert "$GH_REPO" "$numero" "$marcador" "$cuerpo"; then
              echo "::warning::no se pudo publicar el tablero de #${numero}; el ciclo continúa."
              fallos=$((fallos + 1))
            fi
            rm -f "$cuerpo"
          done

          echo "Tableros repasados: $(printf '%s\n' "$numeros" | wc -l), con ${fallos} sin publicar."
          exit 0
