name: Revisar bloque Sirius

# Orquesta la revisión independiente de Sirius en cuanto se aplica
# sirius:review-requested (solo ocurre tras Quality en verde sobre el head
# registrado). Ver la cabecera de implement-sirius-work.yml para el contexto
# general del mecanismo y el aviso sobre verificar la interfaz de
# `anthropics/claude-code-action`.
#
# Dos modos, gobernados por la variable de repositorio
# SIRIUS_CODEX_REVIEW_ENABLED (contrato operativo §4.1):
#
#   - ausente o distinta de `true`: revisión solo con Claude, como antes de la
#     revisión dual (el gate de verificación de head y el reviewed_head_sha
#     obligatorio aplican en ambos modos: son parte del contrato §4.1, no de
#     la bandera);
#   - `true`: revisión dual obligatoria. Se solicita primero la revisión nativa
#     de Codex (comentario `@codex review` publicado por el paso determinista),
#     se ejecuta el revisor Claude mientras Codex trabaja, se recoge el
#     resultado de Codex y un agregador determinista combina ambos en un único
#     veredicto. Si Codex no responde, responde sobre otro SHA o su resultado
#     no es identificable, la ronda termina en FAILED_SAFELY: nunca se degrada
#     en silencio a revisión solo Claude ni se aprueba sin ambos revisores.
#
# La bandera permite volver al flujo previo sin revertir commits. La revisión
# automática del panel de Codex permanece apagada: el disparo ocurre únicamente
# aquí, después de Quality. No se usa la API de OpenAI en ningún caso.
#
# Esta pasada es de SOLO LECTURA a propósito: el permiso del job es
# contents: read (no write) y la PR no se toca. Aunque el propio prompt le
# pide a Claude que no edite nada, el permiso del token es la garantía real —
# incluso si Claude intentara hacer push, el token no lo permite. Codex actúa
# igualmente como revisor de solo lectura: la automatización solo publica la
# solicitud de revisión, jamás órdenes de corrección sobre la PR.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write

concurrency:
  group: sirius-review-${{ github.event.issue.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  review:
    name: Revisar con Claude Code (y Codex si está activado)
    if: github.event.label.name == 'sirius:review-requested'
    runs-on: ubuntu-latest
    # Presupuesto de tiempo explícito, para que un timeout de Codex SIEMPRE se
    # traduzca en un resultado estructurado y no en una cancelación del job:
    #   revisor Claude (paso acotado a 30 min)
    # + recolección de Codex (paso acotado a 30 min; la espera interna está
    #   limitada a SIRIUS_CODEX_REVIEW_MAX_TIMEOUT_SECONDS, 1500 s = 25 min,
    #   así que el recolector escribe su FAILED_SAFELY con margen sobrado)
    # + margen para el resto de pasos deterministas.
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Localizar la PR y verificar el head que superó Quality
        id: gate
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SIRIUS_CODEX_REVIEW_ENABLED: ${{ vars.SIRIUS_CODEX_REVIEW_ENABLED }}
        run: |
          set -uo pipefail
          source scripts/automation/sirius_issue.sh

          dual="false"
          if [ "${SIRIUS_CODEX_REVIEW_ENABLED:-}" = "true" ]; then
            dual="true"
          fi
          echo "dual=${dual}" >> "$GITHUB_OUTPUT"

          stop_gate() {
            # stop_gate <reason-slug> <explicacion> — parada segura del gate.
            local reason="$1" why="$2"
            local marker="<!-- sirius-verdict:reviewer:precheck:${reason}:${GITHUB_RUN_ID:-manual}-${GITHUB_RUN_ATTEMPT:-1} -->"
            local body_file
            body_file="$(mktemp)"
            printf '%s\n\n%s\n\n%s\n' "$marker" "🔴 **Me he detenido de forma segura**" "$why" >"$body_file"
            sirius_transition "$GH_REPO" "$ISSUE_NUMBER" "$marker" "$body_file" \
              "sirius:failed-safely" "D93F0B" "Estado temporal: fallo operativo detenido de forma segura" \
              "noclose" "sirius:review-requested" || echo "::error::No se pudo aplicar la parada segura (${reason})."
            rm -f "$body_file"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          }

          mapfile -t pr_numbers < <(sirius_find_pr_for_issue "$GH_REPO" "$ISSUE_NUMBER")
          if [ "${#pr_numbers[@]}" -eq 0 ]; then
            stop_gate "sin-pr" "No encuentro ninguna PR asociada a esta incidencia; no hay nada que revisar."
            exit 0
          fi
          if [ "${#pr_numbers[@]}" -gt 1 ]; then
            stop_gate "varias-pr" "Esta incidencia referencia varias PR distintas; me detengo para no revisar la equivocada."
            exit 0
          fi
          pr_number="${pr_numbers[0]}"

          # Ambos revisores deben auditar exactamente el head que superó
          # Quality. Si la PR avanzó después del último Quality en verde, esta
          # ronda se descarta de forma segura: el nuevo commit tendrá que pasar
          # Quality y abrir su propia ronda de revisión.
          pr_head="$(sirius_retry gh api "repos/${GH_REPO}/pulls/${pr_number}" --jq '.head.sha')"
          if [ -z "${pr_head:-}" ]; then
            stop_gate "pr-illegible" "No he podido leer el head actual de la PR #${pr_number}."
            exit 0
          fi
          scan_file="$(mktemp)"
          sirius_scan_text "$GH_REPO" "$ISSUE_NUMBER" "$scan_file"
          last_ci_sha="$(sirius_extract_sha "$scan_file")"
          rm -f "$scan_file"
          if [ "$last_ci_sha" = "no-head" ] || [ "$last_ci_sha" != "$pr_head" ]; then
            stop_gate "head-obsoleto" "El head actual de la PR #${pr_number} (\`${pr_head}\`) no coincide con el último head que superó Quality (\`${last_ci_sha}\`). No inicio una revisión sobre una versión sin Quality en verde."
            exit 0
          fi

          # Instante autoritativo en que Quality terminó sobre este head, leido
          # de la API de check-runs (no de un texto de la incidencia, que es
          # editable). Ancla la ronda: el disparador de Codex debe ser
          # posterior a esta marca para pertenecer a la ronda posterior a CI.
          quality_completed_at="$(sirius_retry gh api "repos/${GH_REPO}/commits/${pr_head}/check-runs" \
            --jq '[.check_runs[] | select(.name == "quality" and .conclusion == "success") | .completed_at] | sort | last // empty')"
          if [ -z "${quality_completed_at:-}" ]; then
            stop_gate "quality-sin-marca" "No he podido leer el instante en que Quality terminó en verde sobre \`${pr_head}\`. Sin esa marca no puedo demostrar que la solicitud de revisión pertenece a la ronda posterior a CI."
            exit 0
          fi

          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${pr_head}" >> "$GITHUB_OUTPUT"
          echo "quality_completed_at=${quality_completed_at}" >> "$GITHUB_OUTPUT"

      - name: Consumir el evento y marcar en curso
        if: steps.gate.outputs.valid == 'true'
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          source scripts/automation/sirius_issue.sh
          sirius_set_issue_labels "$GH_REPO" "$ISSUE_NUMBER" \
            "sirius:reviewing" "sirius:review-requested"

      - name: Solicitar la revisión de Codex (modo dual)
        if: steps.gate.outputs.valid == 'true' && steps.gate.outputs.dual == 'true'
        id: codex_trigger
        # Un fallo aquí no corta el job: sin archivo de estado, la recolección
        # y la agregación terminan en FAILED_SAFELY estructurado, nunca en
        # aprobación silenciosa.
        continue-on-error: true
        shell: bash --noprofile --norc {0}
        env:
          # El comentario disparador debe provenir de una identidad real (el
          # PAT del bot) para que la GitHub App de Codex lo procese; que un
          # comentario automatizado active Codex es una dependencia externa
          # aún no verificada que valida el piloto posterior al merge. El
          # token viaja solo por entorno: nunca en argumentos ni en logs.
          GH_TOKEN: ${{ secrets.SIRIUS_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          QUALITY_COMPLETED_AT: ${{ steps.gate.outputs.quality_completed_at }}
          # Identificador de ronda: el run de Actions. Estable en las
          # reejecuciones del mismo run (idempotencia), distinto en una ronda
          # nueva sobre el mismo head (no reutiliza revisiones anteriores).
          ROUND_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          python3 scripts/automation/sirius_codex_review.py trigger \
            --repo "$GH_REPO" \
            --pr "$PR_NUMBER" \
            --head "$HEAD_SHA" \
            --round-id "$ROUND_ID" \
            --quality-completed-at "$QUALITY_COMPLETED_AT" \
            --state-file "${RUNNER_TEMP}/sirius_codex_state.json"

      - name: Preparar instrucciones para Claude Code
        if: steps.gate.outputs.valid == 'true'
        id: build_prompt
        shell: bash --noprofile --norc {0}
        env:
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        run: |
          set -uo pipefail
          {
            echo "prompt<<SIRIUS_PROMPT_EOF"
            cat scripts/automation/prompts/reviewer.md
            echo ""
            echo "## Contexto de esta ejecución"
            echo "- Repositorio: ${GH_REPO}"
            echo "- Incidencia de trabajo: #${ISSUE_NUMBER}"
            echo "- Pull Request a auditar: #${PR_NUMBER}"
            echo "- Head SHA que superó Quality y que debes auditar: ${HEAD_SHA}"
            echo "- El archivo de veredicto debe escribirse en la ruta exacta de la variable de entorno SIRIUS_VERDICT_FILE."
            echo "SIRIUS_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ejecutar Claude Code (revisor)
        if: steps.gate.outputs.valid == 'true'
        id: claude
        continue-on-error: true
        # Acotado explícitamente para que la duración de Claude no pueda comerse
        # el presupuesto reservado a la espera de Codex (ver timeout del job).
        timeout-minutes: 30
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          SIRIUS_VERDICT_FILE: ${{ runner.temp }}/sirius_verdict.json
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.build_prompt.outputs.prompt }}
          claude_args: '--dangerously-skip-permissions --allowedTools "Bash,Read,Grep,Glob" --max-turns 60'

      - name: Recoger el resultado de Codex (modo dual)
        if: steps.gate.outputs.valid == 'true' && steps.gate.outputs.dual == 'true'
        id: codex_collect
        # Timeout o error producen un JSON FAILED_SAFELY estructurado; si ni
        # siquiera se puede escribir ese archivo, la agregación fallará y el
        # veredicto ausente detendrá la incidencia de forma segura.
        continue-on-error: true
        # Mayor que el tope interno de espera del recolector
        # (SIRIUS_CODEX_REVIEW_MAX_TIMEOUT_SECONDS, 25 min por defecto): el
        # recolector siempre llega a escribir su resultado determinista antes
        # de que este paso expire.
        timeout-minutes: 30
        shell: bash --noprofile --norc {0}
        env:
          # Solo lectura: recoger el resultado no necesita el PAT.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          ROUND_ID: ${{ github.run_id }}
          SIRIUS_CODEX_REVIEW_TIMEOUT_SECONDS: ${{ vars.SIRIUS_CODEX_REVIEW_TIMEOUT_SECONDS }}
          SIRIUS_CODEX_REVIEW_MAX_TIMEOUT_SECONDS: ${{ vars.SIRIUS_CODEX_REVIEW_MAX_TIMEOUT_SECONDS }}
        run: |
          set -uo pipefail
          python3 scripts/automation/sirius_codex_review.py collect \
            --repo "$GH_REPO" \
            --pr "$PR_NUMBER" \
            --head "$HEAD_SHA" \
            --round-id "$ROUND_ID" \
            --state-file "${RUNNER_TEMP}/sirius_codex_state.json" \
            --output "${RUNNER_TEMP}/sirius_codex_review.json"

      - name: Agregar los veredictos (modo dual)
        if: steps.gate.outputs.valid == 'true' && steps.gate.outputs.dual == 'true'
        id: aggregate
        continue-on-error: true
        shell: bash --noprofile --norc {0}
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        run: |
          set -uo pipefail
          python3 scripts/automation/sirius_aggregate_reviews.py \
            --claude-file "${RUNNER_TEMP}/sirius_verdict.json" \
            --codex-file "${RUNNER_TEMP}/sirius_codex_review.json" \
            --expected-head "$HEAD_SHA" \
            --mode dual \
            --output "${RUNNER_TEMP}/sirius_aggregated_verdict.json"

      - name: Aplicar el veredicto
        if: always() && steps.gate.outputs.valid == 'true'
        shell: bash --noprofile --norc {0}
        env:
          # Este paso NO es Claude, es el script determinista. Si el veredicto es
          # CHANGES_REQUESTED aplica `sirius:repair-requested`, que debe despertar
          # al corrector: por eso usa el PAT (un labeled del GITHUB_TOKEN quedaría
          # suprimido). El paso de Claude de este workflow conserva el token de
          # solo lectura (contents: read), así que la garantía de que el revisor
          # no puede hacer push se mantiene intacta.
          GH_TOKEN: ${{ secrets.SIRIUS_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DUAL_MODE: ${{ steps.gate.outputs.dual }}
        run: |
          set -uo pipefail
          # En modo dual SOLO se aplica el veredicto agregado: no existe ningún
          # camino que aplique el veredicto de Claude sin haber esperado a
          # Codex. Si la agregación no llegó a producir el archivo, el paso
          # determinista lo trata como veredicto ausente y detiene la
          # incidencia de forma segura.
          if [ "${DUAL_MODE}" = "true" ]; then
            verdict_file="${RUNNER_TEMP}/sirius_aggregated_verdict.json"
          else
            verdict_file="${RUNNER_TEMP}/sirius_verdict.json"
          fi
          bash scripts/automation/sirius_apply_verdict.sh \
            "$GH_REPO" "$ISSUE_NUMBER" "reviewer" "$verdict_file"
