name: Contador de los siete días

# `sirius-racha` (D1a+D1b, incidencia #268) ejecuta la pasada del verificador de
# proyección, añade sus líneas al registro y evalúa la racha que el contrato
# §11.2 exigía para conmutar una clase. Este fichero es el acto aparte que
# ADR-074 dejó dicho —«engancharlo a un reloj es un acto aparte»— y que ADR-002
# prohibía dentro de aquel bloque: lo escribió el 25-08-2026 una sesión
# interactiva con la puerta de `.github/**` abierta por el propietario. Fue la
# CUARTA pieza correcta a la que no llamaba nadie en este repositorio (antes, el
# despachador, H-13 y el supervisor).
#
# ---------------------------------------------------------------------------
# POR QUÉ YA NO TIENE HORARIO (ADR-225, 01-10-2026)
#
# La línea del contador quedó CANCELADA por decisión del propietario el
# 13-09-2026 (incidencia #610): la pieza (C) que cablearía el retorno del
# desenlace al almacén y declararía la primera clase no se ordenará salvo
# decisión nueva suya. Sin esa pieza `CLASES_CON_ESTADO_PROPIO` sigue vacío
# (ADR-101) y cada pasada solo puede escribir `no_comparable`. Medido en el
# registro de la rama de memoria antes de retirar el reloj: 19 pasadas
# programadas entre el 13-09 y el 01-10, 22 líneas, 44 ejes, los 44
# `no_comparable`. Una pasada diaria que no puede medir nada es trabajo inútil
# con horario, así que el `schedule` se retira y queda `workflow_dispatch`: la
# pasada se puede lanzar a mano, y el comando y su registro siguen enteros.
#
# SI ALGÚN DÍA LA LÍNEA VUELVE (otro ADR, por decisión del propietario), el
# horario NO se elige a ojo: `uv run sirius-racha --hora-recomendada` lee los
# `schedule: cron:` de este directorio, busca el mayor hueco libre y devuelve
# su punto medio, porque un día solo puede salir VERDE si nada se movió durante
# la ventana de tolerancia previa a la pasada (`max(timeout-minutes) x 2`,
# medido en el cierre de #265). El 25-08-2026 esa hora fue 03:24 UTC, con 172
# minutos tranquilos frente a 170 de tolerancia: un margen de DOS minutos que
# obligaba a que ningún job del repositorio pasara de 85. Las guardas que lo
# vigilaban (`tests/automation/test_contador_de_siete_dias.py` y las de los
# topes en otros workflows) se retiraron con el horario; al volver a cablearlo
# hay que volver a derivarlas con él. La derivación sigue probada sola en
# `tests/engine/test_seven_day_streak.py`.
#
# ---------------------------------------------------------------------------
# POR QUÉ COMPARTE GRUPO DE CONCURRENCIA CON EL MOTOR, y no es cautela de más:
# `sirius-racha` construye un `DurableWorkEngineStore` sobre el diario del motor,
# y **construirlo puede ESCRIBIR**. Al reproducir el diario, el almacén reconcilia
# los cortes por presupuesto que quedaron a medias, y esa reconciliación anexa
# eventos (`work_item_budget_cutoff_abandoned` desde ADR-092, o la cascada entera
# antes de eso). Abrir el diario para «solo leer» no es solo leer. Dos
# invocaciones simultáneas sobre él se pisan -medido en
# `tests/engine/test_exclusion_entre_invocaciones.py`-, así que este workflow
# entra en el MISMO grupo global que `motor-sirius.yml` y `despachar-orden.yml`.
#
# LO QUE ESTE WORKFLOW NO HACE, y está escrito para que nadie lo suponga: **no
# conmuta nada**. El contrato §11.3 reserva la conmutación de autoridad a un acto
# explícito del propietario. Aquí solo se mide y se registra. `sirius-racha`
# devuelve 0 tanto si la racha CUMPLE como si no: su verde significa «la pasada
# se hizo», nunca «los siete días están».

on:
  # Sin `schedule` desde ADR-225 (ver la cabecera): la pasada se lanza a mano.
  workflow_dispatch:

concurrency:
  # MISMO grupo que el motor y el despachador, a propósito. Ver la cabecera.
  group: motor-sirius
  cancel-in-progress: false

# `contents: write` para confirmar el registro en la rama de memoria (ADR-083).
# No hay `issues: write` porque este comando no escribe en ninguna incidencia:
# solo LEE el espejo por `gh`, y darlo sería un permiso que nadie usa.
permissions:
  contents: write

jobs:
  pasada:
    name: Dar la pasada diaria
    runs-on: ubuntu-latest
    # Quince minutos sobran: las 19 pasadas de septiembre duraron 0,4 min de
    # media (Actions). Hasta ADR-225 este tope además no podía pasar de 85,
    # porque entraba en la tolerancia que juzgaba su propia hora.
    timeout-minutes: 15
    env:
      RAMA_MEMORIA: estado-del-motor

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # La pasada confirma el registro en la rama de memoria, así que
          # necesita credenciales que persistan para el `git push` final.
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          # El paquete exige `>=3.14,<3.15`. Con el `python3` del sistema
          # (3.12 en `ubuntu-latest`) el comando no arranca: familia de H-13.
          python-version: "3.14.6"

      - name: Sync environment
        run: uv sync --locked --all-groups

      - name: Traer la memoria del motor
        env:
          # `env:` de PASO: aquí `runner` SÍ está resuelto. Se declara en cada
          # paso que la use, y no por `$GITHUB_ENV`, por la misma razón que en
          # `motor-sirius.yml`: el paso que confirma lleva `if: always()`.
          MEMORIA: ${{ runner.temp }}/memoria
        run: |
          set -uo pipefail
          git config user.name "sirius-motor"
          git config user.email "canelamoraguezandyjesus@gmail.com"

          # Se ramifica por el CÓDIGO de `ls-remote`, no por su signo: 2 es "el
          # remoto contestó y la rama no está" y 128 es "no pude hablar con el
          # remoto". Colapsarlos crearía una rama huérfana VACÍA por un corte de
          # red, y la pasada mediría contra un diario en blanco -es decir,
          # registraría un día sin nada que medir como si el mundo estuviera
          # sano-.
          codigo=0
          git ls-remote --exit-code --heads origin "$RAMA_MEMORIA" >/dev/null || codigo=$?
          case "$codigo" in
            0)
              git fetch --depth=1 origin "$RAMA_MEMORIA"
              git worktree add "$MEMORIA" "origin/$RAMA_MEMORIA"
              ;;
            2)
              echo "La rama $RAMA_MEMORIA no existe todavía; se crea vacía."
              git worktree add --orphan -b "$RAMA_MEMORIA" "$MEMORIA"
              ;;
            *)
              echo "::error::no se pudo consultar el remoto (ls-remote salió con $codigo)." >&2
              exit 1
              ;;
          esac

      - name: Dar la pasada
        env:
          # `gh` es quien lee el espejo (`GitHubCliMirrorReader`), y sin token no
          # lee nada. Ojo: una lectura caída NO rompe la pasada -el comando lo
          # declara y sigue, ADR-084- así que un token ausente daría una pasada
          # VERDE que no mide nada. Es el modo de fallo silencioso de esta pieza.
          GH_TOKEN: ${{ secrets.SIRIUS_BOT_TOKEN }}
          SIRIUS_MOTOR_DIARIO: ${{ runner.temp }}/memoria/diario.jsonl
          MEMORIA: ${{ runner.temp }}/memoria
        run: |
          set -uo pipefail
          # El registro vive en la RAMA DE MEMORIA, no en `main` (ADR-093, que
          # afina ADR-074): `main` exige pull request desde el ruleset del
          # 24-08-2026, y un registro que se quedara en una PR sin fusionar haría
          # que la pasada siguiente contara sobre un historial viejo. Es el mismo
          # razonamiento por el que el diario del motor se mudó allí (ADR-083),
          # y por el mismo motivo: no es lento, sería incorrecto.
          uv run sirius-racha --registro "$MEMORIA/racha_siete_dias.jsonl"

      - name: Confirmar el registro
        # Se ejecuta aunque la pasada falle: si llegó a añadir líneas y luego
        # murió, esas líneas ya están escritas y perderlas sería peor que el
        # propio fallo. Una pasada sin líneas nuevas no confirma nada.
        if: always()
        env:
          MEMORIA: ${{ runner.temp }}/memoria
        run: |
          set -uo pipefail
          if [ ! -d "$MEMORIA" ]; then
            echo "No se llegó a preparar la memoria; no hay nada que confirmar."
            exit 0
          fi
          cd "$MEMORIA"

          # Se mira el CÓDIGO de `git status`, no su salida: una salida vacía
          # porque el comando reventó se leería como "no hay líneas nuevas" y
          # este paso saldría en VERDE tirando la medición del día.
          if ! estado=$(git status --porcelain); then
            echo "::error::no se pudo leer el estado de la memoria; esto NO es una pasada sin líneas." >&2
            exit 1
          fi
          if [ -z "$estado" ]; then
            echo "La pasada no registró ninguna línea nueva."
            echo "No es un fallo: un trabajo cuya incidencia no se pudo leer, o que"
            echo "todavía no tiene autoridad de incidencia, no produce línea a propósito."
            exit 0
          fi
          git add -A
          git commit -m "Pasada del contador del $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Sin reintento ni rebase: el grupo de concurrencia garantiza que no
          # hay otra invocación empujando a la vez. Si esto falla, esa garantía
          # no se cumplió, y eso hay que verlo en rojo.
          git push origin "HEAD:refs/heads/$RAMA_MEMORIA"
