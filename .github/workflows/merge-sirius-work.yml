name: Fusionar bloque Sirius

# Ejecuta el merge de la PR asociada a una incidencia. Hay DOS autorizaciones
# posibles, y las dos llegan aquí (contrato operativo §8 y §14, ADR-205):
#
#   1. La aprobación de los DOS revisores, que es la vía normal desde ADR-205.
#      `sirius:ready-for-merge` solo la pone `sirius_apply_verdict.sh` con el
#      veredicto agregado REVIEW_APPROVED: si Claude o Codex piden cambios o no
#      contestan, la incidencia no llega a esa etiqueta. Por eso la etiqueta ya
#      ES la aprobación de los dos.
#   2. La orden exacta "fusiona" del propietario, que sigue existiendo como
#      mando manual y como forma de reintentar tras resolver un bloqueo.
#
# Lo que no cambia: el script vuelve a verificar TODO por REST antes de
# fusionar —etiqueta, PR única, abierta y sin conflictos, head idéntico al
# aprobado, Quality verde sobre ese head exacto— y las comprobaciones son las
# mismas por las dos vías. Ver scripts/automation/sirius_merge_on_command.sh.

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read

concurrency:
  group: merge-sirius-work-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  merge:
    name: Fusionar si la orden es válida
    if: >-
      github.event.issue.pull_request == null &&
      (
        (
          github.event_name == 'issues' &&
          github.event.label.name == 'sirius:ready-for-merge'
        ) || (
          github.event_name == 'issue_comment' &&
          github.event.comment.author_association == 'OWNER' &&
          contains(github.event.issue.labels.*.name, 'sirius:ready-for-merge')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout automation library
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Fusionar bloque Sirius
        shell: bash --noprofile --norc {0}
        env:
          # Las verificaciones (etiqueta, PR, head, Quality) van con el
          # GITHUB_TOKEN (tiene checks: read, etc.). El merge en sí se ejecuta
          # con el PAT (SIRIUS_TRIGGER_TOKEN) para que el evento de "PR fusionada"
          # dispare el cierre automático (complete-sirius-after-merge.yml); un
          # merge hecho con el GITHUB_TOKEN por defecto no lo dispararía
          # (regla anti-recursión) y la incidencia se quedaría en ready-for-merge.
          GH_TOKEN: ${{ github.token }}
          SIRIUS_TRIGGER_TOKEN: ${{ secrets.SIRIUS_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # Por la vía de la etiqueta no hay comentario: el identificador que
          # usa el marcador de "no he podido fusionar" es el del run, para que
          # cada intento publique su motivo una sola vez y no se pisen.
          COMMENT_ID: ${{ github.event.comment.id || format('etiqueta-{0}', github.run_id) }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          # Fail-closed: cualquier valor distinto de estos dos detiene el merge.
          SIRIUS_MERGE_AUTORIZACION: ${{ github.event_name == 'issues' && 'revision-dual' || 'comentario' }}
        run: |
          set -uo pipefail
          bash scripts/automation/sirius_merge_on_command.sh \
            "$GH_REPO" "$ISSUE_NUMBER" "$COMMENT_ID" "$COMMENT_BODY"
