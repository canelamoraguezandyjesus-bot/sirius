name: Advance Sirius after Quality

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: advance-sirius-quality-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  advance:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Advance matching Sirius work item
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO