name: Advance Sirius after Quality

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: advance-sirius-quality-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  advance:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Advance matching Sirius work item
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          pr_number="$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')"
          if [ -z "$pr_number" ]; then
            echo "No pull request associated with workflow run ${RUN_ID}."
            exit 0
          fi

          pr_state="$(gh pr view "$pr_number" --repo "$GH_REPO" --json state --jq '.state')"
          pr_draft="$(gh pr view "$pr_number" --repo "$GH_REPO" --json isDraft --jq '.isDraft')"
          current_head="$(gh pr view "$pr_number" --repo "$GH_REPO" --json headRefOid --jq '.headRefOid')"

          if [ "$pr_state" != "OPEN" ] || [ "$pr_draft" = "true" ]; then
            echo "PR #${pr_number} is not an open, reviewable pull request."
            exit 0
          fi

          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "Ignoring stale Quality result for ${HEAD_SHA}; current PR head is ${current_head}."
            exit 0
          fi

          pr_url="https://github.com/${GH_REPO}/pull/${pr_number}"
          mapfile -t issue_numbers < <(
            gh issue list \
              --repo "$GH_REPO" \
              --state open \
              --limit 100 \
              --search "\"${pr_url}\" in:body" \
              --json number,labels \
              --jq '.[] | select(any(.labels[]?; .name == "sirius:ci-pending")) | .number'
          )

          if [ "${#issue_numbers[@]}" -eq 0 ]; then
            echo "No open Sirius work item in ci-pending references PR #${pr_number}."
            exit 0
          fi

          if [ "${#issue_numbers[@]}" -ne 1 ]; then
            for issue_number in "${issue_numbers[@]}"; do
              gh issue comment "$issue_number" --repo "$GH_REPO" --body "<!-- sirius-quality:${HEAD_SHA}:ambiguous -->

El flujo encontró varias incidencias \\`sirius:ci-pending\\` para la PR #${pr_number}. Se detiene de forma segura para evitar una transición ambigua.

- Head SHA: \\`${HEAD_SHA}\\`
- Quality: ${RUN_URL}"
              gh issue edit "$issue_number" --repo "$GH_REPO" --remove-label "sirius:ci-pending" --add-label "sirius:failed-safely"
            done
            exit 1
          fi

          issue_number="${issue_numbers[0]}"

          case "$CONCLUSION" in
            success)
              gh issue comment "$issue_number" --repo "$GH_REPO" --body "<!-- sirius-quality:${HEAD_SHA}:success -->

## QUALITY_SUCCESS

- PR: ${pr_url}
- Head SHA: \\`${HEAD_SHA}\\`
- Quality run: ${RUN_URL}
- Resultado: \\`success\\`
- Siguiente transición: revisión independiente."
              gh issue edit "$issue_number" --repo "$GH_REPO" --remove-label "sirius:ci-pending" --add-label "sirius:review-requested"
              ;;
            failure|timed_out)
              gh issue comment "$issue_number" --repo "$GH_REPO" --body "<!-- sirius-quality:${HEAD_SHA}:${CONCLUSION} -->

## CI_FAILURE

- PR: ${pr_url}
- Head SHA: \\`${HEAD_SHA}\\`
- Quality run: ${RUN_URL}
- Resultado: \\`${CONCLUSION}\\`
- Corrección autorizada: inspeccionar los jobs y logs fallidos de este run y corregir únicamente su causa dentro del alcance de la incidencia."
              gh issue edit "$issue_number" --repo "$GH_REPO" --remove-label "sirius:ci-pending" --add-label "sirius:repair-requested"
              ;;
            *)
              gh issue comment "$issue_number" --repo "$GH_REPO" --body "<!-- sirius-quality:${HEAD_SHA}:${CONCLUSION} -->

## CI_STOPPED_SAFELY

- PR: ${pr_url}
- Head SHA