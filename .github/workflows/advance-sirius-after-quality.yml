name: Advance Sirius after Quality

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: advance-sirius-quality-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  advance:
    # La segunda condicion importa desde que el repositorio es publico
    # (ADR-044): la PR de un desconocido contra `main` dispara Quality EN ESTE
    # repositorio, y su `workflow_run` llegaria aqui, que es el unico workflow
    # alcanzable desde fuera que porta el PAT. Exigir que la rama de cabeza sea
    # de este repositorio deja fuera las bifurcaciones sin tocar ningun camino
    # legitimo: un bloque de Sirius siempre se implementa en una rama propia.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout automation library
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Advance matching Sirius work item
        shell: bash --noprofile --norc {0}
        env:
          # Las LECTURAS de este paso (API de Actions para localizar la PR,
          # estado de la PR, incidencias candidatas) van con el GITHUB_TOKEN, que
          # tiene los permisos declarados del workflow (actions: read, etc.). El
          # PAT no tiene alcance de Actions y aquí daría 403.
          GH_TOKEN: ${{ github.token }}
          # TODA ESCRITURA de etiqueta va con el PAT (identidad real): un
          # `issues: labeled` del GITHUB_TOKEN queda suprimido (anti-recursión).
          # No son solo las que despiertan al rol siguiente
          # (`sirius:review-requested` / `sirius:repair-requested`): también
          # `sirius:failed-safely`, que no despierta a ningún workflow pero sí
          # tiene que AVISAR al propietario, y es justo el estado en que la
          # automatización se ha parado y necesita a una persona. Se creyó que
          # bastaba con las dos primeras y `failed-safely` quedó mudo; lo
          # encontró la refutación de AUDITOR-V0-RUN-001 (#154).
          SIRIUS_TRIGGER_TOKEN: ${{ secrets.SIRIUS_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -uo pipefail
          source scripts/automation/sirius_issue.sh

          # Aplica una transición escribiendo la etiqueta con el PAT en una
          # subshell, para que el `issues: labeled` provenga de una identidad real
          # y no lo suprima la regla anti-recursión del GITHUB_TOKEN. Las LECTURAS
          # del paso siguen con el GITHUB_TOKEN. Ninguna escritura de etiqueta
          # llama a `sirius_transition` directamente: esa es la convención que
          # comprueba tests/automation/test_sirius_notifications.py.
          trigger_transition() {
            ( export GH_TOKEN="$SIRIUS_TRIGGER_TOKEN"; sirius_transition "$@" )
          }

          # La PR asociada al run y el estado de la PR se leen por REST con
          # reintentos. Un fallo transitorio de lectura no debe volver roja la
          # canalizacion: se omite de forma segura sin tocar la incidencia.
          pr_number="$(sirius_retry gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')"
          if [ -z "${pr_number:-}" ]; then
            echo "Sin PR asociada al run ${RUN_ID} (o lectura no disponible); no se actua."
            exit 0
          fi

          pr_json="$(sirius_retry gh api "repos/${GH_REPO}/pulls/${pr_number}" --jq '{state: .state, draft: .draft, head: .head.sha}')"
          if [ -z "${pr_json:-}" ]; then
            echo "::warning::No se pudo leer la PR #${pr_number}; se omite sin cambios."
            exit 0
          fi
          pr_state="$(printf '%s' "$pr_json" | jq -r '.state')"
          pr_draft="$(printf '%s' "$pr_json" | jq -r '.draft')"
          current_head="$(printf '%s' "$pr_json" | jq -r '.head')"

          if [ "$pr_state" != "open" ] || [ "$pr_draft" = "true" ]; then
            echo "La PR #${pr_number} no esta abierta y revisable."
            exit 0
          fi
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "Resultado obsoleto para ${HEAD_SHA}; el head actual de la PR es ${current_head}."
            exit 0
          fi

          pr_url="https://github.com/${GH_REPO}/pull/${pr_number}"

          # Candidatas: incidencias abiertas con sirius:ci-pending (REST, con
          # reintentos). Se excluyen PR (REST /issues las incluye).
          #
          # H-34 (incidencias #435 y #442): un verde de Quality puede llegar
          # cuando la incidencia ya no esta en `ci-pending` sino en
          # `failed-safely` (tipicamente tras un update-branch durante la
          # parada, que dispara Quality de nuevo). Buscar candidatas solo en
          # `ci-pending` dejaba ese verde sin registrar: el revisor nunca
          # despertaba y el ciclo quedaba mudo hasta cirugia manual de
          # etiquetas (reponer `ci-pending` + rerun del run de Quality). El
          # resultado VERDE considera tambien `failed-safely` y lo revive
          # hacia revision; un resultado ROJO sigue actuando solo sobre
          # `ci-pending`: revivir una parada segura hacia correccion seria
          # tomar una decision, no registrar un resultado.
          declare -A origen_de=()
          candidate_issues=()
          for etiqueta_origen in "sirius:ci-pending" "sirius:failed-safely"; do
            if [ "$etiqueta_origen" = "sirius:failed-safely" ] && [ "$CONCLUSION" != "success" ]; then
              continue
            fi
            # La consulta va a fichero con su codigo comprobado (revision de
            # la PR #477, P1): con `mapfile < <(...)` el fallo del productor se
            # perdia y una lectura caida se convertia en "no hay candidatas",
            # consumiendo el workflow_run en silencio.
            lote_file="$(mktemp)"
            if ! sirius_retry gh api -X GET "repos/${GH_REPO}/issues" \
                -f state=open -f labels="$etiqueta_origen" -f per_page=100 --paginate \
                --jq '.[] | select(has("pull_request") | not) | .number' >"$lote_file"; then
              rm -f "$lote_file"
              echo "::error::No se pudo listar las incidencias con ${etiqueta_origen}; reintentable."
              exit 1
            fi
            mapfile -t lote <"$lote_file"
            rm -f "$lote_file"
            for n in "${lote[@]:-}"; do
              [ -z "${n:-}" ] && continue
              if [ -n "${origen_de[$n]:-}" ]; then
                # La incidencia lleva LAS DOS etiquetas (transicion parcial
                # anterior): una sola entrada — el saneado lo hace la propia
                # transicion, que retira AMBAS etiquetas-fuente (CSV) dentro
                # de su verificacion (revision de la PR #477, P2 dos veces).
                continue
              fi
              candidate_issues+=("$n")
              origen_de["$n"]="$etiqueta_origen"
            done
          done

          matched_issues=()
          for issue_number in "${candidate_issues[@]:-}"; do
            [ -z "${issue_number:-}" ] && continue
            body_file="$(mktemp)"
            comments_file="$(mktemp)"
            # Ambas lecturas con su fallo propagado (revision de la PR #477,
            # P1): la URL de la PR vive normalmente en un COMENTARIO
            # (sirius_apply_verdict.sh), asi que una lectura caida no es "este
            # candidato no referencia ninguna PR" — descartarlo en silencio
            # consumiria el workflow_run de un solo disparo con la incidencia
            # parada. Reintentable.
            if ! sirius_read_issue_body "$GH_REPO" "$issue_number" >"$body_file"; then
              echo "::error::No se pudo leer el cuerpo de #${issue_number} (lectura-candidato-fallida); reintentable."
              rm -f "$body_file" "$comments_file"
              exit 1
            fi
            if ! sirius_read_issue_comments "$GH_REPO" "$issue_number" >"$comments_file" 2>/dev/null; then
              echo "::error::No se pudieron leer los comentarios de #${issue_number} (lectura-candidato-fallida); reintentable."
              rm -f "$body_file" "$comments_file"
              exit 1
            fi
            if cat "$body_file" "$comments_file" \
              | grep -oE 'https://github\.com/[^/[:space:]]+/[^/[:space:]]+/pull/[0-9]+' \
              | grep -Fxq "$pr_url"; then
              matched_issues+=("$issue_number")
            fi
            rm -f "$body_file" "$comments_file"
          done

          if [ "${#matched_issues[@]}" -eq 0 ]; then
            echo "Ninguna incidencia en ci-pending referencia la PR #${pr_number}."
            exit 0
          fi

          # Ambiguedad: parada segura. Cada transicion a failed-safely es atomica;
          # el resultado global es un fallo (exit 1) que exige intervencion.
          if [ "${#matched_issues[@]}" -ne 1 ]; then
            for issue_number in "${matched_issues[@]}"; do
              marker="<!-- sirius-quality:${HEAD_SHA}:ambiguous -->"
              body_file="$(mktemp)"
              printf '%s\n\n%s\n\n%s\n%s\n' \
                "${marker}" \
                "El flujo encontro varias incidencias \`sirius:ci-pending\` que referencian la PR #${pr_number}. Se detiene de forma segura para evitar una transicion ambigua." \
                "- Head SHA: \`${HEAD_SHA}\`" \
                "- Quality run: ${RUN_URL}" >"$body_file"
              # La parada anade failed-safely: si el ORIGEN de esta candidata
              # ya era failed-safely, no se retira nada (poner y quitar la
              # misma etiqueta hace fallar la verificacion — revision de la
              # PR #477, P1); si venia de ci-pending, se retira esa.
              remueve_ambiguedad="sirius:ci-pending"
              [ "${origen_de[$issue_number]}" = "sirius:failed-safely" ] && remueve_ambiguedad=""
              trigger_transition "$GH_REPO" "$issue_number" "$marker" "$body_file" \
                "sirius:failed-safely" "D93F0B" "Estado temporal: fallo operativo detenido de forma segura" \
                "noclose" "$remueve_ambiguedad" \
                || echo "::error::No se pudo completar la parada segura en #${issue_number}."
              rm -f "$body_file"
            done
            exit 1
          fi

          issue_number="${matched_issues[0]}"
          body_file="$(mktemp)"
          rc=0
          case "$CONCLUSION" in
            success)
              marker="<!-- sirius-quality:${HEAD_SHA}:success -->"
              printf '%s\n\n%s\n\n%s\n%s\n%s\n%s\n%s\n' \
                "${marker}" \
                "## QUALITY_SUCCESS" \
                "- PR: ${pr_url}" \
                "- Head SHA: \`${HEAD_SHA}\`" \
                "- Quality run: ${RUN_URL}" \
                "- Resultado: \`success\`" \
                "- Siguiente transicion: revision independiente." >"$body_file"
              # Las DOS etiquetas-fuente van como removes (CSV) DENTRO de la
              # transicion verificada: retirar una etiqueta ausente se tolera,
              # las etiquetas se aplican y verifican ANTES de publicar el
              # marcador, y el estado no puede quedar con failed-safely
              # conviviendo con review-requested ni en primera ejecucion ni en
              # reintento (revision de la PR #477, P2 dos veces).
              trigger_transition "$GH_REPO" "$issue_number" "$marker" "$body_file" \
                "sirius:review-requested" "8250DF" "Evento consumible: iniciar revisión independiente" \
                "noclose" "sirius:ci-pending,sirius:failed-safely" || rc=1
              ;;
            failure|timed_out)
              marker="<!-- sirius-quality:${HEAD_SHA}:${CONCLUSION} -->"
              printf '%s\n\n%s\n\n%s\n%s\n%s\n%s\n%s\n%s\n' \
                "${marker}" \
                "## CI_FAILURE" \
                "- PR: ${pr_url}" \
                "- Head SHA: \`${HEAD_SHA}\`" \
                "- Quality run: ${RUN_URL}" \
                "- Resultado: \`${CONCLUSION}\`" \
                "- Diagnostico: inspeccionar los jobs y logs fallidos de este run en ${RUN_URL}." \
                "- Correccion autorizada: corregir unicamente su causa dentro del alcance de la incidencia." >"$body_file"
              trigger_transition "$GH_REPO" "$issue_number" "$marker" "$body_file" \
                "sirius:repair-requested" "FBCA04" "Evento consumible: corregir observaciones técnicas registradas" \
                "noclose" "sirius:ci-pending" || rc=1
              ;;
            *)
              marker="<!-- sirius-quality:${HEAD_SHA}:${CONCLUSION} -->"
              printf '%s\n\n%s\n\n%s\n%s\n%s\n%s\n%s\n' \
                "${marker}" \
                "## CI_STOPPED_SAFELY" \
                "- PR: ${pr_url}" \
                "- Head SHA: \`${HEAD_SHA}\`" \
                "- Quality run: ${RUN_URL}" \
                "- Resultado: \`${CONCLUSION}\`" \
                "- No se activa revision ni correccion; la incidencia queda detenida de forma segura para intervencion manual." >"$body_file"
              trigger_transition "$GH_REPO" "$issue_number" "$marker" "$body_file" \
                "sirius:failed-safely" "D93F0B" "Estado temporal: fallo operativo detenido de forma segura" \
                "noclose" "sirius:ci-pending" || rc=1
              ;;
          esac
          rm -f "$body_file"
          if [ "$rc" -ne 0 ]; then
            echo "::error::La transicion de #${issue_number} no se completo; se deja reintentable."
            exit 1
          fi
