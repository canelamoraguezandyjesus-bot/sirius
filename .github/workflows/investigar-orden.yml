# El ejecutor de la clase investigacion (B1, ADR-099).
#
# COMO SE REPARTE EL TRABAJO con el implementador: los dos workflows escuchan la
# MISMA etiqueta de activacion, y el reparto lo decide el campo `Perfil:` del
# cuerpo -que escribe el despachador desde TABLA_PERFILES-. La puerta del
# implementador excluye `investigador` ANTES de consumir el evento, y esta
# puerta exige `investigador` y nada mas. Ninguna incidencia puede ser de los
# dos a la vez, y ninguna se queda sin dueno.
#
# EL EJECUTOR NO ES UN AGENTE DE CLAUDE: es el investigador MEDIDO -el entorno
# del banco (python 3.12, gpt-researcher 0.15.1, NVIDIA + Tavily) que dio 7/7
# con fuentes reales, S2, run 33141864710-. Por eso el montaje del entorno es
# COPIA del de medir-investigador.yml: mismo interprete, mismos pines. Cambiar
# uno de los dos sin el otro seria correr las ordenes sobre un entorno que
# nadie midio.
#
# EL PROTOCOLO CON EL CICLO ES EL DEL IMPLEMENTADOR, sin marcador nuevo
# (criterio de parada (a) de la nota de arranque): se consume el evento igual,
# el guion escribe el MISMO fichero de veredicto -provisional FAILED_SAFELY al
# empezar, definitivo al terminar-, la PR se abre con el token del bot, el
# comentario es el literal `PR abierta: <URL>` y el cierre lo aplica
# `sirius_apply_verdict.sh` con el rol `implementer`, que es el rol que ese
# guion entiende para "quien produce el entregable".
#
# EL TOPE DEL TRABAJO ES 30 MINUTOS y no puede pasar de 85: la ventana de
# tolerancia del contador de los siete dias se deriva del mayor tope de trabajo
# de esta carpeta por dos (§11.2, medido en su dia con el tope de 85 del banco).
name: Investigar una orden

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sirius-investigar-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  investigar:
    name: Investigar con el investigador medido
    if: github.event.label.name == 'sirius:implement-requested'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true
          token: ${{ secrets.SIRIUS_BOT_TOKEN }}

      - name: Congelar la automatización de main
        # ADR-152: el paso POSTERIOR al agente (aplicar el veredicto) ejecuta
        # ESTA copia, tomada de `main` antes de que el investigador toque el
        # árbol. Así ningún agente elige qué automatización aplica su propio
        # veredicto con el PAT, y los arreglos de `main` rigen desde el primer
        # run posterior a su fusión, sea cual sea la rama de la PR.
        timeout-minutes: 1
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          # La copia reproduce el TRAZADO del árbol (scripts/automation y
          # src/sirius_engine): sirius_convergence.py y sirius_drip_guard_cli.py
          # alcanzan src/sirius_engine por parents[2] de su propia ruta. La
          # primera copia, plana (3a00e04), los dejó sin round_history.py y la
          # revisión de #550 paró en registro-de-ronda-fallido (run 34011306916).
          if ! mkdir -p "${RUNNER_TEMP}/automation-de-main/scripts" "${RUNNER_TEMP}/automation-de-main/src" \
            || ! cp -R scripts/automation "${RUNNER_TEMP}/automation-de-main/scripts/automation" \
            || ! cp -R src/sirius_engine "${RUNNER_TEMP}/automation-de-main/src/sirius_engine"; then
            echo "::error::No se pudo congelar la automatización de main; sin la copia no hay veredicto."
            exit 1
          fi
          echo "Automatización congelada desde main $(git rev-parse --short HEAD) en ${RUNNER_TEMP}/automation-de-main (scripts/automation y src/sirius_engine)"

      - name: "Puerta: solo el perfil investigador, y activacion valida"
        id: gate
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
          SIRIUS_TRIGGER_TOKEN: ${{ secrets.SIRIUS_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail

          # CONTRATO DEL LECTOR, EXPLÍCITO (ADR-167, hallazgo 3). Antes solo el
          # código 2 se trataba como error, así que un 127 -la orden no existe-
          # caía en «carril activo» y el trabajo seguía. Ahora: 0 retirado, 1
          # activo, y CUALQUIER otro código detiene el paso sin ejecutar nada.
          retirado_rc=0
          explicacion="$(python3 scripts/automation/sirius_carril_retirado.py investigacion)" || retirado_rc=$?
          case "$retirado_rc" in
            0) carril_retirado=true ;;
            1) carril_retirado=false ;;
            *) echo "::error::El lector del registro de carriles retirados termino con un codigo inesperado (${retirado_rc}); no se ejecuta el carril."
               exit 1 ;;
          esac

          source scripts/automation/sirius_issue.sh

          # EL ESTADO REAL, NO EL DEL EVENTO (ADR-167, hallazgo 2). Un evento
          # atrasado o repetido traia el cuerpo de entonces, asi que una
          # incidencia ya completada podia acabar con `completed` y
          # `failed-safely` a la vez -que el reconciliador reporta como
          # CONTRADICCION que exige revision humana-. Todo lo que decide esta
          # puerta se relee ahora de la API, y de UNA sola instantanea: con tres
          # llamadas, estado, etiquetas y cuerpo podrian venir de tres momentos
          # distintos y la puerta decidiria sobre un estado que nunca existio.
          instantanea="$(mktemp)"
          if ! gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}" > "$instantanea"; then
            echo "::error::No se pudo leer #${ISSUE_NUMBER}; reintentable."
            exit 1
          fi
          leer() { python3 -c "$1" "$instantanea"; }
          estado_actual="$(leer 'import json,sys;print(json.load(open(sys.argv[1])).get("state") or "")')"
          labels_now="$(leer 'import json,sys;print("\n".join(e["name"] for e in json.load(open(sys.argv[1])).get("labels") or []))')"
          cuerpo_actual="$(leer 'import json,sys;print(json.load(open(sys.argv[1])).get("body") or "")')"
          # Una instantanea que no se deja leer no es «la incidencia esta rara»:
          # es que no sabemos nada de ella, y sin saberlo no se toca.
          if [ -z "$estado_actual" ]; then
            echo "::error::La respuesta de la API para #${ISSUE_NUMBER} no se pudo interpretar; no se toca nada."
            exit 1
          fi

          # El perfil sale del cuerpo ACTUAL: si cambió desde el evento, manda
          # el de ahora.
          perfil=$(printf '%s' "$cuerpo_actual" | sed -n 's/^Perfil: *\([A-Za-z_-][A-Za-z_-]*\)@.*/\1/p' | head -1)
          if [ "$perfil" != "investigador" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Perfil '${perfil:-ninguno}' en el cuerpo actual: no es una orden de investigacion; no se toca nada."
            exit 0
          fi

          # No se pisa trabajo cerrado, terminado ni ya consumido. Cubre el
          # evento atrasado, el repetido, y la carrera con
          # `validate-sirius-activation.yml`: si el validador ya retiro la
          # etiqueta, aqui no queda `implement-requested` y no se toca nada.
          #
          # Callarse aqui no pierde el diagnostico: `validate-sirius-activation`
          # es un workflow APARTE que reacciona al MISMO evento de etiqueta y
          # publica el rechazo con su motivo (incidencia-cerrada,
          # estado-incompatible...). Esta puerta se limita a no anadir un
          # veredicto suyo sobre algo que ya no espera.
          for terminal in sirius:completed sirius:failed-safely sirius:blocked-decision sirius:ready-for-merge; do
            if printf '%s\n' "$labels_now" | grep -Fxq "$terminal"; then
              echo "valid=false" >> "$GITHUB_OUTPUT"
              echo "#${ISSUE_NUMBER} ya esta en ${terminal}: no se toca."
              exit 0
            fi
          done
          if [ "$estado_actual" != "open" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "#${ISSUE_NUMBER} esta ${estado_actual}: no se toca."
            exit 0
          fi
          if ! printf '%s\n' "$labels_now" | grep -Fxq "sirius:implement-requested"; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "#${ISSUE_NUMBER} ya no lleva sirius:implement-requested: la activacion no esta viva; no se toca."
            exit 0
          fi

          if [ "$carril_retirado" = "true" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"

            # NI LA RESPUESTA NI LA TRANSICION SE DAN POR HECHAS (ADR-167,
            # hallazgo 1). Antes un fallo del comentario era un `warning` y un
            # fallo de las etiquetas un `error` seguido de `exit 0`: verde en
            # los dos casos. Ahora cualquiera de los dos termina el paso en
            # ROJO. El orden importa y es este a proposito:
            #
            #   1. El comentario primero, y SIN mencionar el estado final: si
            #      la transicion no llega a hacerse, lo publicado sigue siendo
            #      cierto.
            #   2. Las etiquetas despues. Si fallan, la incidencia se queda
            #      donde estaba -con su explicacion ya puesta- y el job rojo
            #      pide reejecucion.
            #
            # Reejecutar CONVERGE: `sirius_comment_once` encuentra su marcador
            # y no republica, y las etiquetas se vuelven a intentar. No se
            # delega en el reconciliador, que para este estado no repara nada:
            # solo informa (contrato §9.1).
            marcador="<!-- sirius-carril-retirado:investigacion -->"
            cuerpo="$(mktemp)"
            {
              printf '%s\n\n' "$marcador"
              printf '%s\n\n' "$explicacion"
              printf 'No se ha investigado nada: ningun modelo se ha ejecutado y esta activacion no la atiende ningun carril.\n'
            } > "$cuerpo"
            if ! sirius_comment_once "$GH_REPO" "$ISSUE_NUMBER" "$marcador" "$cuerpo"; then
              echo "::error::No se pudo publicar la explicacion en #${ISSUE_NUMBER}. NO se ha cambiado ninguna etiqueta: la incidencia sigue como estaba. Reejecutar este job converge."
              exit 1
            fi
            # La MISMA envoltura de una linea que el resto del ciclo: la
            # etiqueta se escribe con el PAT, nunca con el GITHUB_TOKEN, porque
            # GitHub suprime los eventos del token efimero (ADR-014, ADR-015).
            trigger_set_labels() {
              ( export GH_TOKEN="${SIRIUS_TRIGGER_TOKEN:-${GH_TOKEN:-}}"; sirius_set_issue_labels "$@" )
            }
            if ! trigger_set_labels "$GH_REPO" "$ISSUE_NUMBER" \
              "sirius:failed-safely" "sirius:implement-requested" "sirius:planned"; then
              echo "::error::La explicacion esta publicada en #${ISSUE_NUMBER}, pero la transicion a sirius:failed-safely NO se pudo confirmar. Reejecutar este job converge."
              exit 1
            fi
            echo "#${ISSUE_NUMBER}: carril retirado, explicado y cerrado en sirius:failed-safely."
            exit 0
          fi

          # La MISMA validacion de activacion que el implementador: llegar aqui
          # por la etiqueta no basta, la puerta comprueba el estado real.
          if bash scripts/automation/sirius_validate_activation.sh "$GH_REPO" "$ISSUE_NUMBER"; then
            script_rc=0
          else
            script_rc=$?
          fi
          if [ "$script_rc" -ne 0 ]; then
            echo "::error::La validacion de activacion no se pudo completar; reintentable."
            exit 1
          fi
          if ! labels_now="$(gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}" --jq '.labels[].name')"; then
            echo "::error::No se pudieron leer las etiquetas de #${ISSUE_NUMBER}; reintentable."
            exit 1
          fi
          if printf '%s\n' "$labels_now" | grep -Fxq "sirius:implement-requested"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "La activacion no era valida; la puerta ya lo explico en la incidencia."
          fi

      - name: Consumir el evento y marcar en curso
        if: steps.gate.outputs.valid == 'true'
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
          SIRIUS_TRIGGER_TOKEN: ${{ secrets.SIRIUS_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          source scripts/automation/sirius_issue.sh
          trigger_set_labels() {
            ( export GH_TOKEN="${SIRIUS_TRIGGER_TOKEN:-${GH_TOKEN:-}}"; sirius_set_issue_labels "$@" )
          }
          trigger_set_labels "$GH_REPO" "$ISSUE_NUMBER" \
            "sirius:implementing" "sirius:implement-requested" "sirius:planned"

      - name: Install uv
        if: steps.gate.outputs.valid == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Montar el entorno del investigador, aparte del proyecto
        if: steps.gate.outputs.valid == 'true'
        timeout-minutes: 12
        shell: bash --noprofile --norc {0}
        env:
          PYTHON_MEDICION: "3.12"
          VERSION_EXIGIDA: "0.15.1"
        run: |
          set -uo pipefail
          if ! uv venv --no-project --python "$PYTHON_MEDICION" "$RUNNER_TEMP/investigador"; then
            echo "::error::no se pudo crear el entorno del investigador." >&2
            exit 1
          fi
          if ! uv pip install --python "$RUNNER_TEMP/investigador/bin/python" \
              "gpt-researcher==$VERSION_EXIGIDA" "langchain-google-genai==4.3.5" ddgs pyyaml; then
            echo "::error::no se pudo instalar el investigador." >&2
            exit 1
          fi

      - name: Atender la orden
        if: steps.gate.outputs.valid == 'true'
        id: atender
        timeout-minutes: 40
        continue-on-error: true
        shell: bash --noprofile --norc {0}
        env:
          NVIDIA_API_KEY: ${{ secrets.SIRIUS_INVESTIGADOR_NVIDIA_KEY }}
          TAVILY_API_KEY: ${{ secrets.SIRIUS_INVESTIGADOR_TAVILY_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -uo pipefail
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/cuerpo.md"
          # `--tipo auto`: el TEXTO de la orden decide -«a fondo»/«profunda»
          # va en profundo; a secas, normal (interruptor del 28-08-2026)-.
          # 2280 s de plazo del guion, dentro de los 40 min del paso: el plazo
          # de dentro SIEMPRE antes que el de fuera, para morir escribiendo el
          # veredicto en vez de que GitHub mate el proceso con todo dentro.
          # Subido de 1260 con el modo profundo (report_type deep, breadth 3 x
          # depth 2): son ~12 investigaciones internas por orden.
          "$RUNNER_TEMP/investigador/bin/python" scripts/investigacion/atender_orden.py \
            --cuerpo "$RUNNER_TEMP/cuerpo.md" \
            --numero "$ISSUE_NUMBER" \
            --veredicto "$RUNNER_TEMP/sirius_verdict.json" \
            --plazo 2280 \
            --tipo auto

      - name: Abrir la PR del informe
        if: steps.gate.outputs.valid == 'true' && steps.atender.outcome == 'success'
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ secrets.SIRIUS_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          ruta=$(python3 -c "import json,sys;print(json.load(open('$RUNNER_TEMP/sirius_verdict.json'))['ruta_informe'])")
          rama="sirius/investigacion-${ISSUE_NUMBER}"
          git config user.name "sirius-motor"
          git config user.email "canelamoraguezandyjesus@gmail.com"
          git checkout -b "$rama"
          git add "$ruta"
          git commit \
            -m "Investigacion de la orden #${ISSUE_NUMBER}" \
            -m "Informe del investigador del motor (B1, ADR-099) con sus fuentes, a partir del Objetivo de la incidencia #${ISSUE_NUMBER}."
          git push -u origin "$rama"
          url=$(gh pr create --repo "$GH_REPO" --base main --head "$rama" \
            --title "Investigacion de la orden #${ISSUE_NUMBER}" \
            --body "Informe producido por el investigador del motor (B1, ADR-099; configuracion medida de ADR-098). Cierra el encargo de #${ISSUE_NUMBER}. El documento declara su caducidad en la cabecera.")
          # El comentario que el ciclo entiende, LITERAL como en el prompt del
          # implementador: es lo que resuelve la PR en sirius_apply_verdict.sh.
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "PR abierta: ${url}"

      - name: Aplicar el veredicto
        if: always() && steps.gate.outputs.valid == 'true'
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ secrets.SIRIUS_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          bash "${RUNNER_TEMP}/automation-de-main/scripts/automation/sirius_apply_verdict.sh" \
            "$GH_REPO" "$ISSUE_NUMBER" "implementer" "${RUNNER_TEMP}/sirius_verdict.json"
