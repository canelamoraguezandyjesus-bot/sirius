name: Implementar bloque Sirius

# Ejecuta la Routine implementadora genérica de Sirius con Claude Code real,
# dentro de este mismo runner, en cuanto se aplica sirius:implement-requested.
# Sustituye a la "interfaz de Claude/Routines" externa (no inspeccionable)
# descrita en versiones anteriores de SIRIUS_GENERIC_ROUTINES_0.1.md: aquí
# todo el mecanismo vive en el repositorio y es auditable.
#
# Interfaz de `anthropics/claude-code-action@v1` (verificada en ejecución real,
# run 29792217748): la autenticación de GitHub necesita `id-token: write` en los
# permisos y/o `github_token` explícito; los flags de la CLI de Claude (tools,
# turnos) NO son entradas sueltas — van dentro de `claude_args`. Es un producto
# externo que puede cambiar; ante un fallo de este paso, revisa su README y los
# nombres de entrada válidos que la propia acción imprime en el log.
#
# Claude NUNCA muta etiquetas ni cierra la incidencia por su cuenta: solo
# hace el trabajo (código, pruebas, commit, push, PR) y escribe un veredicto
# en un archivo JSON de forma fija. `sirius_apply_verdict.sh` es quien aplica
# esa decisión, reverificando todo por su cuenta.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  # ADR-149: al aplicar el veredicto se consultan los runs de Quality del
  # head con el github.token (las lecturas de Actions no van con el PAT).
  actions: read

concurrency:
  group: sirius-implement-${{ github.event.issue.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implementar con Claude Code
    if: github.event.label.name == 'sirius:implement-requested'
    runs-on: ubuntu-latest
    # 85 (ADR-228): el tope que se REPARTE. El plazo del paso del agente no es
    # un numero fijo: lo calcula «Preparar instrucciones» desde el arranque del
    # job (TOPE_JOB_MIN - RESERVA_FINAL_MIN - lo que consumio la preparacion),
    # asi que el job nunca puede morir antes que el paso y «Aplicar el
    # veredicto» siempre corre. Con 60 y el agente sin plazo propio, el tope
    # del job mataba al implementador a los 59:52 sin diagnostico (#581,
    # 11-09-2026) y el veredicto provisional se publicaba tal cual; con un
    # plazo fijo de 50 (primera version de ADR-228) una preparacion de mas de
    # 35 min volvia a adelantar el tope del job al plazo del paso (ronda 1 de
    # Codex en la PR #675). TOPE_JOB_MIN del paso del prompt tiene que ser este
    # numero (lo exige tests/automation/test_implementador_con_reloj.py).
    timeout-minutes: 85
    env:
      # PySide6 corre sin pantalla en el runner: sin el plugin offscreen, la
      # suite de GUI no falla, ABORTA (SIGABRT de Qt al no encontrar servidor X).
      # El paso "Install Qt system libraries for PySide6 (offscreen)" trae las
      # bibliotecas pero no fija la variable, asi que `uv run pytest` --que este
      # workflow le ORDENA ejecutar al implementador-- se estrellaba. Solo estaba
      # en `quality.yml`; aqui faltaba.
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Anotar el arranque del job
        # ADR-228 (ronda 2 de Codex): todo paso anterior al agente lleva plazo, para que el calculo del plazo llegue siempre antes de que la reserva final empiece a gastarse.
        timeout-minutes: 1
        # ADR-228: el plazo del implementador se calcula desde AQUI. Es el
        # primer paso a proposito: lo que consuman checkout, Qt, uv, sync y
        # las puertas se resta de lo que el agente recibe, y el tope del job
        # no puede llegar antes que el plazo del paso.
        shell: bash --noprofile --norc {0}
        run: echo "JOB_ARRANQUE_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        # ADR-228 (ronda 2 de Codex): plazo propio; la suma de los pasos previos al agente mas la reserva final cabe en el job (lo exige test_implementador_con_reloj.py).
        timeout-minutes: 5
        uses: actions/checkout@v6
        with:
          ref: main
          # A diferencia del resto de workflows de este repositorio, este SÍ
          # necesita hacer push (Claude crea una rama y abre una PR).
          persist-credentials: true
          # La PR debe abrirse con un token que NO sea el GITHUB_TOKEN por
          # defecto: GitHub no dispara workflows (Quality) a partir de eventos
          # generados por el GITHUB_TOKEN (prevención de recursión). Con este
          # PAT la PR y sus pushes provienen de una identidad real y Quality
          # arranca sola, como si la abriera una persona.
          token: ${{ secrets.SIRIUS_BOT_TOKEN }}

      - name: Congelar la automatización de main
        # ADR-152: el paso POSTERIOR al agente (aplicar el veredicto) ejecuta
        # ESTA copia, tomada de `main` antes de que el agente toque el árbol.
        # El agente crea una rama y trabaja en ella; ejecutar después el guion
        # del árbol que dejó significaría que el agente elige qué automatización
        # aplica su propio veredicto con el PAT, y que un arreglo de `main` solo
        # rige en las ramas que ya lo contienen (el 06-09 el veredicto de #545
        # corrió el guion de su rama, sin ADR-149, y no relanzó Quality).
        timeout-minutes: 1
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          # La copia reproduce el TRAZADO del árbol (scripts/automation y
          # src/sirius_engine): sirius_convergence.py y sirius_drip_guard_cli.py
          # alcanzan src/sirius_engine por parents[2] de su propia ruta. La
          # primera copia, plana (3a00e04), los dejó sin round_history.py y la
          # revisión de #550 paró en registro-de-ronda-fallido (run 34011306916).
          if ! mkdir -p "${RUNNER_TEMP}/automation-de-main/scripts" "${RUNNER_TEMP}/automation-de-main/src" \
            || ! cp -R scripts/automation "${RUNNER_TEMP}/automation-de-main/scripts/automation" \
            || ! cp -R src/sirius_engine "${RUNNER_TEMP}/automation-de-main/src/sirius_engine"; then
            echo "::error::No se pudo congelar la automatización de main; sin la copia no hay veredicto."
            exit 1
          fi
          echo "Automatización congelada desde main $(git rev-parse --short HEAD) en ${RUNNER_TEMP}/automation-de-main (scripts/automation y src/sirius_engine)"

      - name: Install Qt system libraries for PySide6 (offscreen)
        # Un `apt-get` colgado se comia el trabajo ENTERO. Sin plazo propio, la
        # descarga espera a un espejo que no responde hasta que GitHub cancela el
        # job a los 20 minutos, y una ejecucion `cancelled` detiene el bloque y
        # exige intervencion manual. Ocurrio dos veces el 19-08-2026 —incidencias
        # #202 y #206—, las dos en este mismo paso y sin llegar a ejecutar una
        # sola prueba: 20 min de runner gastados en nada, dos veces.
        #
        # Tres cambios, en este orden de importancia:
        #  1. No instalar lo que ya esta. El runner suele traer estas
        #     bibliotecas; comprobarlo cuesta milisegundos y, cuando estan,
        #     `apt` no llega a ejecutarse y el fallo no puede ocurrir.
        #  2. Plazo propio por intento. Un espejo que no responde cuesta 60 s,
        #     no 20 minutos.
        #  3. Reintento acotado: el fallo observado es transitorio.
        #
        # Y falla RUIDOSAMENTE si de verdad no puede instalar, en vez de dejar
        # que el job muera por tiempo: un `failure` es diagnosticable y el ciclo
        # sabe tratarlo; un `cancelled` no dice nada y para el bloque.
        #
        # El plazo de paso es la red de seguridad de ultimo recurso: si los
        # plazos internos fallaran, el paso muere en 6 min con `failure`, no
        # el trabajo entero en 20 con `cancelled`.
        timeout-minutes: 10
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          faltan=""
          for lib in libegl1 libgl1 libxkbcommon0; do
            dpkg -s "$lib" >/dev/null 2>&1 || faltan="${faltan} ${lib}"
          done
          if [ -z "$(printf '%s' "$faltan" | tr -d '[:space:]')" ]; then
            echo "Las tres bibliotecas ya estan instaladas; no se toca apt."
            exit 0
          fi
          echo "Faltan por instalar:${faltan}"
          # Intento 1: instalar SIN `update`. La imagen del runner ya trae listas
          # de paquetes, y suelen bastar. Esto evita por completo el paso lento:
          # `apt-get update` refresca TODOS los origenes configurados —Microsoft,
          # Google, Docker...— y ninguno de ellos sirve para estas tres.
          # shellcheck disable=SC2086
          if timeout 150 sudo apt-get install -y --no-install-recommends ${faltan}; then
            echo "Instaladas sin necesidad de refrescar las listas."
            exit 0
          fi
          echo "::warning::No bastaron las listas existentes; refresco e intento otra vez."
          # Intento 2: refrescar y reinstalar, con plazos HOLGADOS. El fallo
          # observado el 19-08 no fue un espejo caido sino uno LENTO: se corto a
          # los 60 s una descarga que iba avanzando. Un plazo demasiado corto
          # convierte lentitud en fallo, que es otra forma de romper el ciclo.
          if timeout 240 sudo apt-get update; then
            # shellcheck disable=SC2086
            if timeout 180 sudo apt-get install -y --no-install-recommends ${faltan}; then
              echo "Instaladas tras refrescar las listas."
              exit 0
            fi
          fi
          echo "::error::No se pudieron instalar las bibliotecas de Qt (${faltan}) con plazos acotados."
          exit 1

      - name: Install uv
        # ADR-228 (ronda 2 de Codex): plazo propio, misma razon que el checkout.
        timeout-minutes: 3
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.14.6"

      - name: Sync environment
        # Plazo propio, por lo mismo que en Quality (ADR-224): sin cache ha
        # tardado 16,5 min; que falle ruidosamente, no que se coma el plazo del
        # agente ni cancele el job. 19 y no 20: congelar 1 + Qt 10 + sync 19 +
        # agente 50 = 80, y el job (85, el maximo) cubre ademas el resto.
        timeout-minutes: 19
        run: uv sync --locked --all-groups
      - name: Verificar precondiciones de activación
        # ADR-228 (ronda 2 de Codex): plazo propio (varias lecturas de la API con reintentos), misma razon que el checkout.
        timeout-minutes: 5
        id: gate
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -uo pipefail
          # EL PERFIL `investigador` NO LO ATIENDE ESTE WORKFLOW, y la exclusion
          # va AQUI, ANTES de consumir el evento: si se excluyera despues, las
          # etiquetas ya estarian movidas y nadie atenderia la orden. Se sale con
          # valid=false, que es "no es mio", no un fallo.
          #
          # ESTA EXCLUSION SE CONSERVA TRAS LA RETIRADA DEL CARRIL (ADR-161,
          # ejecutado por ADR-163), y conviene decir por que, porque la tentacion
          # de quitarla es exactamente el defecto: investigacion comparte la
          # etiqueta de activacion con programacion (ADR-099), asi que sin ella
          # una activacion con perfil `investigador` **se implementaria como
          # programacion**. Quien responde ahora es `investigar-orden.yml`, que
          # en vez de investigar explica que el carril esta retirado.
          #
          # LO QUE CAMBIA (ADR-167, segunda ronda, hallazgo 3): la decision ya no
          # se toma aqui. Esta puerta leia el perfil del cuerpo del EVENTO y la
          # de investigacion el del cuerpo ACTUAL, asi que un cuerpo editado
          # entre el evento y el arranque producia los dos desenlaces peores -o
          # ninguna atendia la orden, o la atendian las dos a la vez-. El reparto
          # vive ahora en `sirius_reparto_activacion.sh`, que llaman las dos y
          # que exige una activacion NUEVA cuando el perfil cambio, en vez de
          # cambiar el tipo de trabajo en silencio.
          reparto_rc=0
          bash scripts/automation/sirius_reparto_activacion.sh \
            "$GH_REPO" "$ISSUE_NUMBER" "$(python3 scripts/automation/resolver_prompt.py --perfil | sed 's/@.*//')" \
            "otros" || reparto_rc=$?
          case "$reparto_rc" in
            0) : ;;
            1) echo "valid=false" >> "$GITHUB_OUTPUT"
               echo "El cuerpo actual de #${ISSUE_NUMBER} declara el perfil investigador: esta activacion no la consume el implementador."
               exit 0 ;;
            2) echo "valid=false" >> "$GITHUB_OUTPUT"
               echo "::error::El perfil del cuerpo cambio desde que se aplico la etiqueta: este evento pedia otro trabajo y no se ha ejecutado nada. NO se ha tocado ninguna etiqueta -no se puede probar que la activacion presente sea la de este evento-. El diagnostico esta en la incidencia."
               exit 1 ;;
            *) echo "::error::El reparto de la activacion no se pudo decidir (codigo ${reparto_rc}); no se consume el evento."
               exit 1 ;;
          esac
          if bash scripts/automation/sirius_validate_activation.sh "$GH_REPO" "$ISSUE_NUMBER"; then
            script_rc=0
          else
            script_rc=$?
          fi
          if [ "$script_rc" -eq 2 ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::error::El Perfil del cuerpo cambio desde que se aplico la etiqueta (la instantanea del evento y el cuerpo vigente no coinciden): este evento es rancio y no se consume. NO se ha tocado ninguna etiqueta -la activacion presente puede ser de otro evento posterior-. El aviso esta en la incidencia (ADR-221)."
            exit 1
          fi
          if [ "$script_rc" -ne 0 ]; then
            echo "::error::La validacion de activacion no se pudo completar; reintentable."
            exit 1
          fi
          # Un fallo de LECTURA no es una activacion invalida. Distinguirlos es
          # todo: cuando esta lectura fallaba en silencio, su salida vacia se
          # convertia en `valid=false` y el paso anunciaba que "la puerta ya la
          # rechazo y explico el motivo en la incidencia" -- falso: no rechazaba
          # nada ni explicaba nada, y dejaba la incidencia en un callejon MUDO,
          # con sus etiquetas intactas y sin ningun evento que pudiera revivirla.
          # Ocurrio en la #186 (runs 32035648135 y 32037335181, "unexpected end
          # of JSON input" tras cuatro reintentos). Es la misma clase de fallo que
          # la #138 vino a eliminar y que `sirius_validate_activation.sh` evita a
          # proposito unas lineas mas arriba. Ahora falla RUIDOSAMENTE: el run
          # queda en rojo, visible y reintentable.
          # Las etiquetas se leen del OBJETO de la incidencia, NO del endpoint
          # `/issues/<n>/labels`. El 17-08-2026, con el mismo token y en el mismo
          # instante, `issues/186` respondia y `issues/186/labels` devolvia cuerpo
          # vacio: cuatro reintentos, cuatro fallos, en cuatro runs a lo largo de
          # mas de una hora (32035648135, 32037335181, 32039249452, 32039796936).
          # Que una respondiera y la otra no descarta permisos, autenticacion y
          # limite de tasa: los tres habrian roto ambas. El objeto ya trae
          # `labels`, asi que da los mismos nombres y ahorra una llamada.
          if ! labels_now="$(gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}" --jq '.labels[].name')"; then
            echo "::error::No se pudieron leer las etiquetas de #${ISSUE_NUMBER}; no puedo distinguir una activacion invalida de un fallo de lectura. Reintentable."
            exit 1
          fi
          if printf '%s\n' "$labels_now" | grep -Fxq "sirius:implement-requested"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "La activacion no era valida; la puerta ya la rechazo y explico el motivo en la incidencia."
          fi

      - name: Consumir el evento y marcar en curso
        # ADR-228 (ronda 2 de Codex): plazo propio, misma razon que el checkout.
        timeout-minutes: 3
        if: steps.gate.outputs.valid == 'true'
        id: consume
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
          SIRIUS_TRIGGER_TOKEN: ${{ secrets.SIRIUS_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # La instantanea del evento, por `env:` y nunca interpolada en el
          # `run:` (misma razon que en «Preparar instrucciones»).
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -uo pipefail
          source scripts/automation/sirius_issue.sh
          # ADR-221 (ronda 8 de Codex en la PR #670): la puerta comparo la
          # instantanea del evento con el cuerpo vigente hace unos segundos, y
          # en ese hueco el propietario puede haber editado el `Perfil:` (el
          # aviso de version no vigente se lo pide). Se vuelve a comparar JUSTO
          # antes de consumir, con el mismo parser (`resolver_prompt.py
          # --perfil`): si cambio, este evento es rancio, no se consume nada y
          # no se toca ninguna etiqueta -la activacion presente es de otro
          # evento-. `consumed=false` deja a «Aplicar el veredicto» fuera: no
          # hay nada que aplicar sobre una activacion que no es de este run.
          sin_consumir() {
            echo "consumed=false" >> "$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 1
          }
          perfil_evento="$(ISSUE_BODY="${ISSUE_BODY-}" python3 scripts/automation/resolver_prompt.py --perfil)" \
            || sin_consumir "No se pudo leer el Perfil de la instantanea del evento de #${ISSUE_NUMBER}; no se consume nada."
          cuerpo_ahora="$(sirius_read_issue_body "$GH_REPO" "$ISSUE_NUMBER")" \
            || sin_consumir "No se pudo leer el cuerpo vigente de #${ISSUE_NUMBER}; no se consume nada. Reintentable."
          perfil_ahora="$(ISSUE_BODY="$cuerpo_ahora" python3 scripts/automation/resolver_prompt.py --perfil)" \
            || sin_consumir "No se pudo leer el Perfil del cuerpo vigente de #${ISSUE_NUMBER}; no se consume nada."
          if [ "$perfil_evento" != "$perfil_ahora" ]; then
            sin_consumir "El Perfil de #${ISSUE_NUMBER} cambio entre la puerta y la consumicion (evento: ${perfil_evento:-ninguno}; ahora: ${perfil_ahora:-ninguno}): este evento es rancio y no se consume. NO se ha tocado ninguna etiqueta -la activacion presente es de otro evento- (ADR-221)."
          fi
          # La etiqueta NOTIFICABLE se escribe con el PAT: un `issues: labeled`
          # emitido con el GITHUB_TOKEN no dispara otros workflows (regla
          # anti-recursion de GitHub), asi que `notify-sirius-state.yml` no se
          # entera y el estado no avisa nunca. Mismo patron ya aprobado en
          # `advance-sirius-after-quality.yml`. Las LECTURAS siguen con el
          # GITHUB_TOKEN.
          trigger_set_labels() {
            ( export GH_TOKEN="${SIRIUS_TRIGGER_TOKEN:-${GH_TOKEN:-}}"; sirius_set_issue_labels "$@" )
          }
          trigger_set_labels "$GH_REPO" "$ISSUE_NUMBER" \
            "sirius:implementing" "sirius:implement-requested" "sirius:planned"
          echo "consumed=true" >> "$GITHUB_OUTPUT"

      - name: Preparar instrucciones para Claude Code
        # ADR-228 (ronda 2 de Codex): plazo propio; es el paso que reparte el plazo y tiene que llegar con la reserva final intacta.
        timeout-minutes: 2
        if: steps.gate.outputs.valid == 'true'
        id: build_prompt
        shell: bash --noprofile --norc {0}
        env:
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # El cuerpo viaja por `env:` y NUNCA interpolado dentro del `run:`: un
          # `${{ github.event.issue.body }}` en el script se sustituye antes de
          # que bash lea nada, asi que un cuerpo con acentos graves o `$(...)`
          # ejecutaria lo que llevara dentro con los permisos de este trabajo.
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -uo pipefail
          # C3 (incidencia #333): el prompt se ELIGE por el campo `Perfil:` del
          # cuerpo, en vez de estar clavado a fuego. Sin esto, una orden de clase
          # `documentacion` arrancaria el ciclo y ejecutaria el prompt de
          # programacion: una vuelta completa FALSA, que es justo lo que el
          # implementador se nego a entregar cuando se le pidio este bloque.
          # H-28 (auditoria #396): la VERSION gobierna el texto. Antes se
          # extraia el rol tirando la version y se leia el prompt vigente de
          # main, asi que `implementer@1` podia significar dos textos
          # distintos en dos Runs. El manifiesto fija fichero y sha256 por
          # rol@N y el resolver para en ROJO -sin repliegue ni adivinar- ante
          # perfil ausente, rol@N desconocido o texto movido sin registrar
          # version nueva: ejecutar el prompt equivocado produce trabajo que
          # parece hecho y no lo esta.
          if ! PROMPT_ROL=$(python3 scripts/automation/resolver_prompt.py --carril ejecucion); then
            exit 1
          fi
          echo "Prompt del encargo segun el manifiesto: ${PROMPT_ROL}"
          # ADR-228: el plazo, a la vista del implementador, como el del
          # corrector desde ADR-155, pero CALCULADO desde el arranque del job y
          # no clavado. El job tiene TOPE_JOB_MIN (la guarda exige que sea su
          # `timeout-minutes`), «Anotar el arranque del job» dejo
          # JOB_ARRANQUE_EPOCH en el entorno, y lo que la preparacion haya
          # consumido (checkout, Qt, uv, sync, puerta, evento, este paso) se
          # resta: plazo = TOPE_JOB - RESERVA_FINAL - consumido. Asi el plazo
          # que recibe el agente es cierto aunque la preparacion sea lenta
          # (ronda 1 de Codex en la PR #675: con un plazo fijo de 50 y una
          # preparacion de mas de 35 min, el job moria antes que el paso y
          # «Aplicar el veredicto» con el). RESERVA_FINAL_MIN cubre «Aplicar el
          # veredicto» (plazo propio de 5) y el margen del job, y todos los
          # pasos anteriores a este llevan plazo propio: su suma (49) mas la
          # reserva final cabe en el job, asi que este calculo llega siempre
          # con la reserva intacta (ronda 2 de Codex: sin esos plazos, una
          # preparacion de 83 minutos dejaba dos para el veredicto).
          # RESERVA_VALIDACION_MIN es la cadena
          # completa en el runner, medida hasta 21,4 min (#653, run
          # 35516764738: pytest 1283 s); y por debajo de PLAZO_MINIMO_MIN no se
          # arranca al agente: se escribe un veredicto FAILED_SAFELY que dice
          # cuanto comio la preparacion y «Aplicar el veredicto» lo publica.
          # Las horas van con fecha (ISO) para que un run que cruce la
          # medianoche no sea ambiguo frente a `date -u`. Sin esto, el
          # implementador de #581 murio a los 59:52 sin una linea de
          # diagnostico (bitacora, entrada 92): sin reloj no podia saber que
          # el encargo no cabia, aunque su prompt le mandara decirlo.
          TOPE_JOB_MIN=85
          RESERVA_FINAL_MIN=6
          RESERVA_VALIDACION_MIN=25
          PLAZO_MINIMO_MIN=40
          : "${JOB_ARRANQUE_EPOCH:?falta JOB_ARRANQUE_EPOCH: el paso «Anotar el arranque del job» no corrio}"
          ahora_epoch="$(date -u +%s)"
          consumido_min=$(( (ahora_epoch - JOB_ARRANQUE_EPOCH + 59) / 60 ))
          plazo_min=$(( TOPE_JOB_MIN - RESERVA_FINAL_MIN - consumido_min ))
          if [ "$plazo_min" -lt "$PLAZO_MINIMO_MIN" ]; then
            # El paso del agente se salta, pero su `timeout-minutes` lee esta
            # salida y tiene que ser un numero valido.
            echo "plazo_min=1" >> "$GITHUB_OUTPUT"
            printf '{"verdict":"FAILED_SAFELY","summary":"La preparación del runner consumió %s minutos de los %s del job y al implementador le quedaban %s, por debajo del mínimo de %s: no se arranca al agente. La causa es la preparación (checkout, Qt, uv sync), no el encargo; reintentable con `continua`."}\n' \
              "$consumido_min" "$TOPE_JOB_MIN" "$plazo_min" "$PLAZO_MINIMO_MIN" > "${RUNNER_TEMP}/sirius_verdict.json"
            echo "::error::La preparacion consumio ${consumido_min} min de los ${TOPE_JOB_MIN} del job; quedaban ${plazo_min} para el implementador (minimo ${PLAZO_MINIMO_MIN}). No se arranca al agente; el veredicto FAILED_SAFELY lo dice."
            exit 1
          fi
          echo "plazo_min=${plazo_min}" >> "$GITHUB_OUTPUT"
          plazo_utc="$(date -u -d "+${plazo_min} minutes" +%Y-%m-%dT%H:%M:%SZ)"
          limite_validacion_utc="$(date -u -d "+$((plazo_min - RESERVA_VALIDACION_MIN)) minutes" +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "prompt<<SIRIUS_PROMPT_EOF"
            cat "$PROMPT_ROL"
            echo ""
            echo "## Contexto de esta ejecución"
            echo "- Repositorio: ${GH_REPO}"
            echo "- Incidencia de trabajo: #${ISSUE_NUMBER}"
            echo "- Rama base: main"
            echo "- Plazo de esta ejecución (ADR-228): tu paso muere a las ${plazo_utc} UTC (${plazo_min} minutos desde ahora; comprueba la hora con \`date -u\`). Arranca la validación final no más tarde de las ${limite_validacion_utc} UTC: la cadena completa ha tardado hasta 21 minutos en el runner. Si a esa hora no has terminado, deja de implementar, valida lo hecho una sola vez, empuja lo que tengas y escribe el veredicto con lo hecho y lo que falta (\`FAILED_SAFELY\` si no está entregable): un diagnóstico a tiempo vale más que morir en el tope sin decir nada."
            echo "- El archivo de veredicto debe escribirse en la ruta exacta de la variable de entorno SIRIUS_VERDICT_FILE."
            echo "SIRIUS_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ejecutar Claude Code (implementador)
        if: steps.gate.outputs.valid == 'true'
        id: claude
        continue-on-error: true
        # ADR-228: plazo PROPIO y calculado, el mismo numero que recibe en su
        # prompt (`plazo_min`, salida del paso anterior). Que muera su paso y
        # no el job: asi «Aplicar el veredicto» corre con normalidad y publica
        # lo que el agente dejo, y el agente sabe a que hora tiene que haber
        # escrito su diagnostico. El `|| '1'` solo cubre el caso en que el
        # paso anterior no corrio (puerta invalida): este paso se salta igual.
        timeout-minutes: ${{ fromJSON(steps.build_prompt.outputs.plazo_min || '1') }}
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.SIRIUS_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SIRIUS_VERDICT_FILE: ${{ runner.temp }}/sirius_verdict.json
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Mismo PAT para que `gh pr create` y el push de Claude provengan de
          # una identidad real (ver la nota del checkout): así el evento
          # `pull_request` dispara Quality.
          github_token: ${{ secrets.SIRIUS_BOT_TOKEN }}
          prompt: ${{ steps.build_prompt.outputs.prompt }}
          # `--max-turns` alto: B6d (la integración más grande de B6) agotó los
          # 120 turnos previos a mitad del trabajo real (run 29868614857:
          # error_max_turns, 121 turnos, 14,6 min) sin llegar a push/PR/veredicto.
          # 300 da margen para bloques grandes; los pequeños terminan mucho antes.
          claude_args: '--model opus --dangerously-skip-permissions --allowedTools "Bash,Read,Write,Edit,Grep,Glob" --max-turns 300'
          # La salida completa del agente NO va al log: el repositorio es
          # publico y los registros de Actions de un repositorio publico los lee
          # cualquiera, sin cuenta, durante 90 dias. La transcripcion integra
          # incluye lo que el agente leyo del arbol, sus razonamientos y lo que
          # imprimieron los comandos que ejecuto. Estuvo en `true` mientras el
          # repositorio era privado y el propio comentario ya preveia revertirlo;
          # la apertura lo hizo obligatorio (ADR-044). Para auditar una ejecucion
          # quedan el veredicto en `SIRIUS_VERDICT_FILE` y el resumen del paso.
          show_full_output: false

      - name: Aplicar el veredicto
        # ADR-228 (ronda 2 de Codex): plazo propio por debajo de RESERVA_FINAL_MIN (6): la reserva que el paso del prompt descuenta es exactamente la que este paso puede consumir.
        timeout-minutes: 5
        # `consumed != 'false'` y no `== 'true'`: si «Consumir el evento» muere sin
        # escribir su salida, el veredicto corre igual (es lo que limpia una
        # consumicion a medias); solo un evento declarado rancio lo deja fuera.
        if: always() && steps.gate.outputs.valid == 'true' && steps.consume.outputs.consumed != 'false'
        shell: bash --noprofile --norc {0}
        env:
          # El veredicto escribe el estado resultante, que puede ser notificable
          # (`ci-pending` no lo es, pero `failed-safely` y `blocked-decision` sí).
          GH_TOKEN: ${{ secrets.SIRIUS_BOT_TOKEN }}
          # ADR-149: las lecturas de Actions (¿terminó ya Quality para este
          # head?) van con el github.token; el relanzamiento, con el PAT.
          SIRIUS_READ_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          bash "${RUNNER_TEMP}/automation-de-main/scripts/automation/sirius_apply_verdict.sh" \
            "$GH_REPO" "$ISSUE_NUMBER" "implementer" "${RUNNER_TEMP}/sirius_verdict.json"
