name: Implementar bloque Sirius

# Ejecuta la Routine implementadora genérica de Sirius con Claude Code real,
# dentro de este mismo runner, en cuanto se aplica sirius:implement-requested.
# Sustituye a la "interfaz de Claude/Routines" externa (no inspeccionable)
# descrita en versiones anteriores de SIRIUS_GENERIC_ROUTINES_0.1.md: aquí
# todo el mecanismo vive en el repositorio y es auditable.
#
# Interfaz de `anthropics/claude-code-action@v1` (verificada en ejecución real,
# run 29792217748): la autenticación de GitHub necesita `id-token: write` en los
# permisos y/o `github_token` explícito; los flags de la CLI de Claude (tools,
# turnos) NO son entradas sueltas — van dentro de `claude_args`. Es un producto
# externo que puede cambiar; ante un fallo de este paso, revisa su README y los
# nombres de entrada válidos que la propia acción imprime en el log.
#
# Claude NUNCA muta etiquetas ni cierra la incidencia por su cuenta: solo
# hace el trabajo (código, pruebas, commit, push, PR) y escribe un veredicto
# en un archivo JSON de forma fija. `sirius_apply_verdict.sh` es quien aplica
# esa decisión, reverificando todo por su cuenta.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: sirius-implement-${{ github.event.issue.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implementar con Claude Code
    if: github.event.label.name == 'sirius:implement-requested'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # PySide6 corre sin pantalla en el runner: sin el plugin offscreen, la
      # suite de GUI no falla, ABORTA (SIGABRT de Qt al no encontrar servidor X).
      # El paso "Install Qt system libraries for PySide6 (offscreen)" trae las
      # bibliotecas pero no fija la variable, asi que `uv run pytest` --que este
      # workflow le ORDENA ejecutar al implementador-- se estrellaba. Solo estaba
      # en `quality.yml`; aqui faltaba.
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          # A diferencia del resto de workflows de este repositorio, este SÍ
          # necesita hacer push (Claude crea una rama y abre una PR).
          persist-credentials: true
          # La PR debe abrirse con un token que NO sea el GITHUB_TOKEN por
          # defecto: GitHub no dispara workflows (Quality) a partir de eventos
          # generados por el GITHUB_TOKEN (prevención de recursión). Con este
          # PAT la PR y sus pushes provienen de una identidad real y Quality
          # arranca sola, como si la abriera una persona.
          token: ${{ secrets.SIRIUS_BOT_TOKEN }}
      
      - name: Install Qt system libraries for PySide6 (offscreen)
        # Un `apt-get` colgado se comia el trabajo ENTERO. Sin plazo propio, la
        # descarga espera a un espejo que no responde hasta que GitHub cancela el
        # job a los 20 minutos, y una ejecucion `cancelled` detiene el bloque y
        # exige intervencion manual. Ocurrio dos veces el 19-08-2026 —incidencias
        # #202 y #206—, las dos en este mismo paso y sin llegar a ejecutar una
        # sola prueba: 20 min de runner gastados en nada, dos veces.
        #
        # Tres cambios, en este orden de importancia:
        #  1. No instalar lo que ya esta. El runner suele traer estas
        #     bibliotecas; comprobarlo cuesta milisegundos y, cuando estan,
        #     `apt` no llega a ejecutarse y el fallo no puede ocurrir.
        #  2. Plazo propio por intento. Un espejo que no responde cuesta 60 s,
        #     no 20 minutos.
        #  3. Reintento acotado: el fallo observado es transitorio.
        #
        # Y falla RUIDOSAMENTE si de verdad no puede instalar, en vez de dejar
        # que el job muera por tiempo: un `failure` es diagnosticable y el ciclo
        # sabe tratarlo; un `cancelled` no dice nada y para el bloque.
        #
        # El plazo de paso es la red de seguridad de ultimo recurso: si los
        # plazos internos fallaran, el paso muere en 6 min con `failure`, no
        # el trabajo entero en 20 con `cancelled`.
        timeout-minutes: 6
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          faltan=""
          for lib in libegl1 libgl1 libxkbcommon0; do
            dpkg -s "$lib" >/dev/null 2>&1 || faltan="${faltan} ${lib}"
          done
          if [ -z "$(printf '%s' "$faltan" | tr -d '[:space:]')" ]; then
            echo "Las tres bibliotecas ya estan instaladas; no se toca apt."
            exit 0
          fi
          echo "Faltan por instalar:${faltan}"
          for intento in 1 2; do
            # shellcheck disable=SC2086
            if timeout 60 sudo apt-get update \
               && timeout 120 sudo apt-get install -y --no-install-recommends ${faltan}; then
              echo "Instaladas en el intento ${intento}."
              exit 0
            fi
            echo "::warning::Intento ${intento} agotado o fallido; reintento."
            sleep 5
          done
          echo "::error::No se pudieron instalar las bibliotecas de Qt tras 2 intentos acotados."
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.14.6"

      - name: Sync environment
        run: uv sync --locked --all-groups
      - name: Verificar precondiciones de activación
        id: gate
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          if bash scripts/automation/sirius_validate_activation.sh "$GH_REPO" "$ISSUE_NUMBER"; then
            script_rc=0
          else
            script_rc=$?
          fi
          if [ "$script_rc" -ne 0 ]; then
            echo "::error::La validacion de activacion no se pudo completar; reintentable."
            exit 1
          fi
          # Un fallo de LECTURA no es una activacion invalida. Distinguirlos es
          # todo: cuando esta lectura fallaba en silencio, su salida vacia se
          # convertia en `valid=false` y el paso anunciaba que "la puerta ya la
          # rechazo y explico el motivo en la incidencia" -- falso: no rechazaba
          # nada ni explicaba nada, y dejaba la incidencia en un callejon MUDO,
          # con sus etiquetas intactas y sin ningun evento que pudiera revivirla.
          # Ocurrio en la #186 (runs 32035648135 y 32037335181, "unexpected end
          # of JSON input" tras cuatro reintentos). Es la misma clase de fallo que
          # la #138 vino a eliminar y que `sirius_validate_activation.sh` evita a
          # proposito unas lineas mas arriba. Ahora falla RUIDOSAMENTE: el run
          # queda en rojo, visible y reintentable.
          # Las etiquetas se leen del OBJETO de la incidencia, NO del endpoint
          # `/issues/<n>/labels`. El 17-08-2026, con el mismo token y en el mismo
          # instante, `issues/186` respondia y `issues/186/labels` devolvia cuerpo
          # vacio: cuatro reintentos, cuatro fallos, en cuatro runs a lo largo de
          # mas de una hora (32035648135, 32037335181, 32039249452, 32039796936).
          # Que una respondiera y la otra no descarta permisos, autenticacion y
          # limite de tasa: los tres habrian roto ambas. El objeto ya trae
          # `labels`, asi que da los mismos nombres y ahorra una llamada.
          if ! labels_now="$(gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}" --jq '.labels[].name')"; then
            echo "::error::No se pudieron leer las etiquetas de #${ISSUE_NUMBER}; no puedo distinguir una activacion invalida de un fallo de lectura. Reintentable."
            exit 1
          fi
          if printf '%s\n' "$labels_now" | grep -Fxq "sirius:implement-requested"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "La activacion no era valida; la puerta ya la rechazo y explico el motivo en la incidencia."
          fi

      - name: Consumir el evento y marcar en curso
        if: steps.gate.outputs.valid == 'true'
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
          SIRIUS_TRIGGER_TOKEN: ${{ secrets.SIRIUS_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          source scripts/automation/sirius_issue.sh
          # La etiqueta NOTIFICABLE se escribe con el PAT: un `issues: labeled`
          # emitido con el GITHUB_TOKEN no dispara otros workflows (regla
          # anti-recursion de GitHub), asi que `notify-sirius-state.yml` no se
          # entera y el estado no avisa nunca. Mismo patron ya aprobado en
          # `advance-sirius-after-quality.yml`. Las LECTURAS siguen con el
          # GITHUB_TOKEN.
          trigger_set_labels() {
            ( export GH_TOKEN="${SIRIUS_TRIGGER_TOKEN:-${GH_TOKEN:-}}"; sirius_set_issue_labels "$@" )
          }
          trigger_set_labels "$GH_REPO" "$ISSUE_NUMBER" \
            "sirius:implementing" "sirius:implement-requested" "sirius:planned"

      - name: Preparar instrucciones para Claude Code
        if: steps.gate.outputs.valid == 'true'
        id: build_prompt
        shell: bash --noprofile --norc {0}
        env:
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          {
            echo "prompt<<SIRIUS_PROMPT_EOF"
            cat scripts/automation/prompts/implementer.md
            echo ""
            echo "## Contexto de esta ejecución"
            echo "- Repositorio: ${GH_REPO}"
            echo "- Incidencia de trabajo: #${ISSUE_NUMBER}"
            echo "- Rama base: main"
            echo "- El archivo de veredicto debe escribirse en la ruta exacta de la variable de entorno SIRIUS_VERDICT_FILE."
            echo "SIRIUS_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ejecutar Claude Code (implementador)
        if: steps.gate.outputs.valid == 'true'
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.SIRIUS_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SIRIUS_VERDICT_FILE: ${{ runner.temp }}/sirius_verdict.json
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Mismo PAT para que `gh pr create` y el push de Claude provengan de
          # una identidad real (ver la nota del checkout): así el evento
          # `pull_request` dispara Quality.
          github_token: ${{ secrets.SIRIUS_BOT_TOKEN }}
          prompt: ${{ steps.build_prompt.outputs.prompt }}
          # `--max-turns` alto: B6d (la integración más grande de B6) agotó los
          # 120 turnos previos a mitad del trabajo real (run 29868614857:
          # error_max_turns, 121 turnos, 14,6 min) sin llegar a push/PR/veredicto.
          # 300 da margen para bloques grandes; los pequeños terminan mucho antes.
          claude_args: '--dangerously-skip-permissions --allowedTools "Bash,Read,Write,Edit,Grep,Glob" --max-turns 300'
          # Salida completa en el log del runner (repo privado, log solo visible
          # para el propietario): permite auditar qué hizo el implementador si
          # vuelve a agotarse el presupuesto o falla. Revertir a false cuando el
          # ciclo esté estabilizado.
          show_full_output: true

      - name: Aplicar el veredicto
        if: always() && steps.gate.outputs.valid == 'true'
        shell: bash --noprofile --norc {0}
        env:
          # El veredicto escribe el estado resultante, que puede ser notificable
          # (`ci-pending` no lo es, pero `failed-safely` y `blocked-decision` sí).
          GH_TOKEN: ${{ secrets.SIRIUS_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          bash scripts/automation/sirius_apply_verdict.sh \
            "$GH_REPO" "$ISSUE_NUMBER" "implementer" "${RUNNER_TEMP}/sirius_verdict.json"
