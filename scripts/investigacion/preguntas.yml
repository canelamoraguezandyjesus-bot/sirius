# Banco de preguntas de respuesta conocida para medir al investigador (S2).
#
# POR QUÉ ASÍ, y no una pregunta suelta. El plan pide «una pregunta de respuesta
# conocida»; una sola no da un porcentaje, y el propietario pidió «por lo menos un
# 80 %». Con cinco preguntas el número existe y cada acierto vale 20 puntos.
#
# CÓMO SE CORRIGE, dicho aquí porque es la parte más débil de esta medición: se
# busca en el informe una lista de cadenas obligatorias. Es CRUDO a propósito —un
# corrector automático fino exigiría otro modelo juzgando, y entonces estaríamos
# midiendo al juez—. Lo que este método NO puede hacer:
#
#   - No sabe si el informe está bien ESCRITO, solo si contiene el dato.
#   - Puede dar por bueno un informe que nombre el dato de pasada, sin sostenerlo.
#   - Puede suspender un informe correcto que use un sinónimo no previsto.
#
# Por eso cada pregunta admite VARIAS formas de la respuesta, y por eso el informe
# de la medición guarda el texto entero: el número es una señal, no un veredicto,
# y quien dude puede leer lo que de verdad contestó.
#
# CRITERIO DE ELECCIÓN de las preguntas: respuesta estable (no cambia de un mes a
# otro), verificable sin ambigüedad, y que EXIJA buscar —nada que un modelo pueda
# contestar de memoria sin salir a la red no mide al investigador, mide al modelo—.
# Las dos primeras son de memoria a propósito: si esas fallan, el fallo es del
# modelo y no de la búsqueda, y conviene poder distinguirlo.

version: 1

preguntas:
  - id: P1
    tipo: memoria
    texto: "¿Cuál es la capital de Australia?"
    # `Canberra` es inequívoco y ningún modelo útil debería fallarlo. Si falla,
    # el problema no es el buscador: es el modelo o el cableado.
    obligatorias: ["Canberra"]

  - id: P2
    tipo: memoria
    texto: "¿En qué año llegó el ser humano a la Luna por primera vez?"
    obligatorias: ["1969"]

  - id: P3
    tipo: busqueda
    texto: "¿Qué licencia de software usa el proyecto GPT Researcher en GitHub?"
    # Se conserva de la primera version, y con una advertencia: un modelo grande
    # puede saberla de memoria. Vale como control -si esta falla, el problema no
    # es el buscador- pero NO demuestra que se haya investigado. Eso lo demuestra
    # `fuentes > 0`, que es la condicion que de verdad separa las dos cosas.
    obligatorias: ["Apache"]

  - id: P4
    tipo: busqueda
    texto: "¿En qué lenguaje de programación está escrito el gestor de paquetes uv, de Astral?"
    obligatorias: ["Rust"]

  - id: P5
    tipo: busqueda
    texto: "¿Cuál es el nombre del sistema de tipos estático para Python mantenido por Meta, alternativa a mypy?"
    obligatorias: ["Pyre"]

  # --- Las que un modelo NO puede recitar ------------------------------------
  #
  # REFUTADO EL 26-08-2026 Y CORREGIDO A MEDIAS. Un refutador señalo que NINGUNA
  # de las cinco primeras obliga a buscar: la licencia de un proyecto conocido, el
  # lenguaje de `uv` y el verificador de Meta son hechos estables y notorios que
  # cualquier modelo util recita sin salir a la red. El banco incumplia su propio
  # criterio de eleccion, escrito veinte lineas mas arriba.
  #
  # Con el buscador muerto, esas cinco habrian dado 100 %.
  #
  # La primera mitad del arreglo fue estructural y ya esta: `fuentes > 0`. Sin
  # fuentes no hay acierto, aunque la respuesta sea correcta.
  #
  # Esta es la segunda mitad: preguntas cuya respuesta **cambia**, de modo que
  # recitarla de memoria da una respuesta VIEJA y por tanto equivocada. No basta
  # con que sean dificiles: tienen que ser PERECEDERAS, que es lo unico que un
  # entrenamiento no puede cubrir.
  #
  # POR ESO LLEVAN FECHA DE REVISION. Una pregunta perecedera caduca por
  # definicion: si nadie la revisa, dentro de unos meses su respuesta correcta
  # sera otra y el banco empezara a suspender informes buenos. Es la misma
  # leccion que ADR-095 saco de los modelos: lo perecedero se declara perecedero.

  - id: P6
    tipo: busqueda_obligada
    revisar_antes_de: 2026-11-30
    texto: >-
      ¿Cuál es el número de la última versión publicada del gestor de paquetes
      uv, de Astral, y en qué mes salió?
    # La ultima version de un paquete vivo cambia cada pocas semanas. Un modelo
    # que conteste de memoria dara una version vieja: no hay forma de acertar sin
    # mirar. Se exige la palabra clave para que el informe hable de versiones, y
    # el acierto real lo decide quien lo lea junto con las fuentes.
    obligatorias: ["uv"]

  - id: P7
    tipo: busqueda_obligada
    revisar_antes_de: 2026-11-30
    texto: >-
      ¿Cuántas estrellas tiene aproximadamente el repositorio de GPT Researcher
      en GitHub a día de hoy?
    # Un contador que sube solo. De memoria se contesta con el numero del
    # entrenamiento, que siempre esta por debajo. Obliga a mirar la pagina.
    obligatorias: ["GPT Researcher"]
