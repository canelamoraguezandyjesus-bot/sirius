  # ADR-212 (#653): al interprete de peticiones se le pedia la cardinalidad con
  # un criterio GRAMATICAL -«un dato concreto», «una cantidad concreta», «todo
  # lo que haya de un tema»- y el banco de 47 casos la puntuaba con el del
  # canon, B04 §15.2: determinacion contra extension. Dos criterios distintos,
  # asi que el modelo aplicaba bien el que se le daba y fallaba en los DOS
  # sentidos: `CA-08` («¿cual es el presupuesto de Beta?») es EXHAUSTIVA para el
  # canon y «un dato concreto» para la instruccion; `CA-50` («¿que condiciones
  # de acceso hay?») es EXACTA y suena a «todo lo que haya». Medido con Ollama
  # real el 20-09-2026 en dos corridas: `cardinalidad 30/47` en las dos, mas de
  # la mitad del error de la palanca 1, con los demas campos entre 41 y 43.
  # Se cierra con el commit que reescribio el bloque: el defecto era que se
  # pedia un criterio y se puntuaba con otro, y eso ya no pasa. Lo que sigue
  # pendiente NO es este defecto sino la MEDICION del efecto, que exige Ollama
  # real y corre el propietario; la prediccion esta publicada en el ADR-212 y
  # sin ajustar, y por debajo de 30/47 en cardinalidad es regresion.
