# Registro de defectos conocidos del Work Engine.
#
# Por qué existe: hasta el 21-08-2026 los defectos encontrados vivían en un
# documento de una rama sin fusionar, sin ninguna incidencia que los siguiera.
# Cuatro de seis seguían vivos en `main` semanas después y la batería completa
# pasaba en verde con ellos dentro. Encontrar un defecto no sirve de nada si
# después se evapora.
#
# Este fichero es la fuente legible por máquina, y
# `tests/automation/test_registro_de_defectos.py` es lo que impide que se
# pudra: un defecto abierto sin incidencia, o que cite un fichero que ya no
# existe, rompe la batería. No encuentra defectos nuevos -eso no lo hace una
# lista-; garantiza que uno encontrado no se pierda.
#
# Un defecto NUNCA se borra de aquí: pasa a `estado: cerrado` con el commit que
# lo cerró. El historial de lo que falló es tan valioso como lo que falla hoy.

