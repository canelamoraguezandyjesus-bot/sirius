entradas:
- entrada: 1
  titulo: 'M18a murió dos veces en el motor (incidencias #507 y #508)'
  fecha: '2026-09-02'
  mecanismo: 'El implementador (implement-sirius-work.yml) agotó los 60 min del job sin crear rama ni
    PR, dos veces con el mismo encargo: el encargo (filtro fiel al laboratorio + banco de latencia + ADR)
    no cabía en una sola ejecución.'
  mejor_manera: 'Partir los encargos hasta que quepan en ~30 min de implementación; candidato de proceso:
    un tamaño máximo de encargo explícito en la orden y permiso del implementador para parar con BLOCKED_BY_DECISION
    por tamaño.'
  deuda: null
  estado_en_main: parcial
  evidencia: 'scripts/automation/prompts/implementer-v4.md:216-218 («Si algo no cabe en el turno o se
    queda colgado, eso es exactamente un FAILED_SAFELY … con su diagnóstico»): el implementador puede
    parar por tamaño con diagnóstico, aunque como FAILED_SAFELY y no BLOCKED_BY_DECISION. AGENTS.md:263,
    regla 6 del método del propietario («Poco a poco, y cerrando por tamaño. Un corte que se pueda terminar»,
    ADR-208 APROBADO). ADR-198 APROBADO: partir un objetivo grande lo hace la sesión interactiva; el descomponedor
    automático queda descartado.'
  que_falta: 'Un tamaño máximo de encargo explícito en la orden o en el contrato: grep «tamaño máximo|30
    minutos|cabe en|demasiado grande» sin resultado en AGENTS.md, .claude/skills, docs/implementation/AUTOMATION_OPERATING_CONTRACT.md
    y scripts/automation/prompts; y la parada específica por tamaño como BLOCKED_BY_DECISION.'
  medible: 'Línea base: muertes del implementador por tope del job sin rama ni PR por cada 10 encargos
    (ola de criticidad: 2, #507 y #508) y minutos de implementación por encargo (M21a: 15). Después: misma
    tasa con el tamaño máximo escrito en la orden, y encargos que paran por tamaño antes del tope frente
    a los que mueren.'
- entrada: 2
  titulo: El banco de latencia dormía la espera real (RNF-003)
  fecha: '2026-09-02'
  mecanismo: La prueba del escenario (c) del banco de latencia esperaba de verdad los 30 s del tiempo
    de espera por consulta (15 min en rojo por construcción) porque el doble agotaba el tiempo en vez
    de contarlo; se parchearon tres rondas de la misma familia (guardias, saltos) antes de ir a la raíz
    (ADR-125).
  mejor_manera: 'Aplicar la regla de ADR-001 a la primera repetición, no a la tercera: «dos rondas de
    la misma familia → parar y buscar la raíz».'
  deuda: null
  estado_en_main: resuelta
  evidencia: 'CLAUDE.md (disciplina de evidencia: «Dos rondas de revisión con defectos de la misma familia
    → parar y buscar la raíz») y .claude/skills/disciplina-evidencia/SKILL.md:40-50 («## 2. Regla de las
    dos rondas»: prohibido seguir parcheando; desde la ronda 2 se cambia la pregunta al revisor), ADR-001
    APROBADO. En el motor, el detector de familia repetida src/sirius_engine/round_family_detector.py
    (ADR-123 y ADR-197 APROBADOS) y ADR-199 APROBADO (la detección detiene el ciclo con blocked-decision
    y la parada vuelve al corrector). Matiz: el detector automático exige 3 rondas consecutivas (RONDAS_CONSECUTIVAS_MINIMAS
    = 3, medido para evitar falsos positivos); la regla humana es a las 2.'
  que_falta: null
  medible: 'Línea base: rondas de parche de la misma familia antes de parar (ADR-125: 3). Después: ≤ 2
    por incidencia, contadas en los RONDA_HALLAZGOS/CORRECCION_APLICADA; y paradas familia-repetida del
    motor (ADR-199) frente a rondas que siguieron goteando.'
- entrada: 3
  titulo: 'Quality en verde consumida mientras la incidencia estaba en `repairing` (dos veces: #508, #514)'
  fecha: '2026-09-03'
  mecanismo: El verde de Quality llegó con la incidencia fuera de ci-pending (en repairing); la ruta H-34
    (advance-sirius-after-quality.yml) no lo registró y la incidencia se quedó parada hasta relanzar el
    run a mano (rerun_workflow_run).
  mejor_manera: 'Candidata de motor: que la ruta H-34 acepte el verde también con la incidencia en repairing/reviewing
    y el mismo head, o que reconcile corra más a menudo que cada 6 h; es una carrera del motor y no debería
    requerir vigilancia humana.'
  deuda: 3
  estado_en_main: resuelta
  evidencia: 'ADR-149 APROBADO («relanzar Quality al entrar en ci-pending cuando su cierre ya se consumió
    con la incidencia en otro estado»): scripts/automation/sirius_apply_verdict.sh:515-526 relanza el
    run terminado del head (POST actions/runs/{id}/rerun) y publica QUALITY_RELANZADO; :413-425 publica
    QUALITY_SIN_ENCAMINAR si no puede. ADR-183 APROBADO (la ausencia de run de Quality para el head se
    encamina, no se espera en silencio) y ADR-194 APROBADO. La deuda 3 consta SALDADA el 07-09 con el
    primer QUALITY_RELANZADO en vivo. El mecanismo no es el literal propuesto (relanzar en vez de aceptar
    el verde fuera de ci-pending; reconcile sigue en cron ''17 */6 * * *'', .github/workflows/reconcile-sirius-states.yml:39),
    pero cierra la carrera sin mano humana.'
  que_falta: null
  medible: 'Línea base: verdes de Quality perdidos por carrera de estado por ola (ola de criticidad: 2
    en M21b más #508 y #514). Después: 0 relanzamientos manuales; recuento de comentarios QUALITY_RELANZADO
    frente a QUALITY_SIN_ENCAMINAR en las incidencias.'
- entrada: 4
  titulo: Vigilancia caída ocho horas (03:08 → 11:09 UTC)
  fecha: '2026-09-03'
  mecanismo: El temporizador de vigilancia en memoria de la sesión murió con un reinicio del contenedor
    y nadie lo repuso; además se informó «esperando el número de incidencia» sin haberlo comprobado.
  mejor_manera: (a) Comprobar siempre el resultado de cada despacho (número de incidencia) antes de informar;
    (b) una rutina programada (Routine) de vigilancia que sobreviva a reinicios, con modelo barato, que
    avise solo cuando cambie una etiqueta.
  deuda: 5
  estado_en_main: parcial
  evidencia: (a) .claude/skills/verificar-el-estado-real/SKILL.md:4 y :50 (antes de afirmar que algo está
    hecho se comprueba contra main y GitHub; «si tampoco, no se afirma el estado») y .claude/skills/modo-nocturno/SKILL.md:36-39,
    regla 2 («No dependas de esperas de fondo. El contenedor se reinicia y las mata sin avisar… el estado
    se lee de GitHub»); skills aprobadas por ADR-214/215. (b) sin evidencia.
  que_falta: '(b) El vigía durable y barato del propio motor: grep «vigía|Routine|rutina programada|send_later|recordatorio|modelo
    barato» en .claude/skills, AGENTS.md y docs/decisions solo devuelve menciones ajenas; la deuda 5 queda
    «mitad remediada» en la bitácora (recordatorios escalonados de la sesión) y ADR-216 APROBADO apaga
    los horarios del motor desde Actions.'
  medible: 'Línea base: horas de incidencia parada sin que nadie la mirase (03-09: 8 h; 07-09: 5 h según
    la deuda 5). Después: tiempo máximo entre un cambio de etiqueta y su aviso con el vigía programado,
    y turnos del modelo caro gastados en vigilar por día.'
- entrada: 5
  titulo: El despacho de M20 fue rechazado dos veces por el intérprete de intención
  fecha: '2026-09-03'
  mecanismo: despachar-orden.yml marcó dos órdenes (WI-20260903-030529 y WI-20260903-095428) como needs_decision
    sin incidencia ni aviso visible porque _MARCADORES_DESTRUCTIVO en src/sirius_engine/intent_interpreter.py
    disparaba por subcadena sin contexto («no borres nada» = «borra la tabla»).
  mejor_manera: (a) Que el intérprete no escale cuando el marcador aparece dentro de una negación/prohibición;
    (b) que un needs_decision deje un comentario o una incidencia visible; (c) que el despachador devuelva
    el motivo en el resumen del run.
  deuda: 2
  estado_en_main: parcial
  evidencia: '(a) ADR-184 APROBADO («la prohibición no es una petición: el detector de sensibilidad exige
    que el marcador no vaya negado»): src/sirius_engine/intent_interpreter.py:356-401 (_va_negado, _negacion_anulada,
    ventana de cuatro palabras, cortes de oración) y tests/engine/test_intent_interpreter.py:250-336.
    (c) src/sirius_engine/dispatch_cli.py:286 y :313 imprimen «Motivo: …» en la salida del run, y la parada
    sale con código 3 (dispatch_cli.py:390-510; ADR-188 y ADR-189 APROBADOS), que pone en rojo el paso
    de .github/workflows/despachar-orden.yml:126-131.'
  que_falta: '(b) Un needs_decision sigue sin dejar comentario ni incidencia: por diseño la parada ocurre
    antes de crear la incidencia (ADR-188) y despachar-orden.yml:51 no tiene issues: write; la salida
    es la orden sirius-decidir (ADR-189) y el listado /trabajos de sirius-motor. (c) El motivo está en
    el registro del run, no en un resumen (sin GITHUB_STEP_SUMMARY en despachar-orden.yml).'
  medible: 'Línea base: falsos positivos del intérprete sobre órdenes reales (2 de 2 despachos de M20
    el 03-09). Después: 0 needs_decision por prohibición sobre el corpus de órdenes de la ola (las cuatro
    tuplas de test_intent_interpreter.py), y minutos entre una parada needs_decision y su descubrimiento
    por una persona.'
- entrada: 6
  titulo: 'M20: el implementador bajó un suelo de prueba a 0 (aserción vacía)'
  fecha: '2026-09-03'
  mecanismo: '_MINIMO_ACIERTOS_EXACTOS_PAQUETE_COMPLETO pasó de 7 a 0 en tests/acceptance: las cuatro
    aserciones del paquete completo pasaban con cualquier resultado (guarda muerta en vez de sustituida
    por otra sobre la métrica que mejoró).'
  mejor_manera: 'Regla de revisión explícita: «un suelo que baja a su mínimo se sustituye por una guarda
    sobre la métrica que sí mejoró»; candidato de Quality: aviso automático cuando una constante _MINIMO_*
    valga 0 o una aserción sea >= 0.'
  deuda: null
  estado_en_main: resuelta
  evidencia: 'ADR-134 APROBADO («el guardián del suelo de prueba muerto retira las dos cotas tautológicas
    del banco de evidencia»): tests/automation/test_suelo_de_prueba_muerto.py:17-25 y :61-83 (regla 1:
    _MINIMO_*: Final[int] = 0; regla 2: assert <expr> >= 0 como línea completa) recorre tests/acceptance/*.py
    y pone Quality en rojo; retiró la constante muerta de test_pa_0_2_rec_01_banco_evidencia.py. La regla
    de revisión en prosa no está en scripts/automation/prompts/reviewer-v2.md (grep «suelo|tautol» sin
    resultado), pero el guardián hace innecesaria la regla para el caso mecánico que la entrada describe.'
  que_falta: null
  medible: 'Línea base: suelos muertos presentes en tests/acceptance (2 el 04-09, ADR-134). Después: 0
    (lo cuenta el propio guardián) y hallazgos de revisión de la familia «prueba que no puede fallar»
    por ola (mina 2026-09: 7 en cuatro encargos).'
- entrada: 7
  titulo: 'M21a: el adaptador nuevo copió un hueco ya corregido en otro adaptador'
  fecha: '2026-09-03'
  mecanismo: 'ollama_criticality_classifier.py se calcó de ollama_category_classifier.py, que no llevaba
    el endurecimiento de M18a (URL absoluta a localhost + follow_redirects=False, CODEX-001 de la PR #452),
    y sus dos pruebas de «nunca sale de localhost» no ejercitaban ninguna petición.'
  mejor_manera: 'Un único módulo cliente de Ollama local (URL, redirects, think, format, timeout) del
    que dependan los adaptadores, en vez de copias del mismo contrato (candidato a encargo de refactor);
    deuda: ollama_category_classifier.py tiene el mismo hueco.'
  deuda: 1
  estado_en_main: parcial
  evidencia: 'La deuda 1 está saldada: ADR-132 APROBADO («el guardián del contrato local de Ollama convierte
    ADR-125 en prueba y corrige ollama_category_classifier»): src/sirius/adapters/ollama_category_classifier.py:91-107
    (/api/chat absoluto a localhost, think False, format cerrado, follow_redirects=False), tests/unit/test_ollama_category_classifier.py:135-140,
    y el guardián tests/automation/test_contrato_http_de_ollama.py que vigila los adaptadores por glob.'
  que_falta: 'El cliente único: los cuatro adaptadores (src/sirius/adapters/ollama_relevance_filter.py,
    ollama_category_classifier.py, ollama_criticality_classifier.py, ollama_query_intent_classifier.py)
    siguen llevando cada uno su copia del contrato; grep «cliente único|OllamaClient|ollama_client|ollama_local_client»
    sin resultado en src/, docs/decisions y AGENTS.md; la deuda 4 de la bitácora no consta saldada.'
  medible: 'Línea base: 4 copias del contrato HTTP de Ollama en src/sirius/adapters (base_url, think,
    format, follow_redirects repetidos). Después: 1 módulo y 4 dependientes; y hallazgos de revisión por
    contrato HTTP copiado mal en adaptadores nuevos (M21a: 2, CODEX-001 P1 y CLAUDE-M21A-001).'
- entrada: 8
  titulo: 'M21a: el adaptador llamaba al modelo sin `think: false` ni salida cerrada (P1)'
  fecha: '2026-09-03'
  mecanismo: 'El clasificador de criticidad usaba /api/generate con prompt libre y 5 s de espera; con
    qwen3:4b-instruct sin think: false la respuesta pasa de segundos a minutos (ADR-125), así que en la
    máquina del propietario siempre habría devuelto None por tiempo agotado. La lección de ADR-125 vivía
    en el filtro, no en el clasificador que sirvió de molde.'
  mejor_manera: El cliente único de la entrada 7, y que las órdenes que crean un adaptador de Ollama digan
    explícitamente «calcado del filtro de relevancia (ADR-125), no del clasificador de categoría».
  deuda: 4
  estado_en_main: parcial
  evidencia: 'ADR-132 APROBADO convierte el contrato de ADR-125 en prueba: tests/automation/test_contrato_http_de_ollama.py
    falla en Quality si un adaptador no sigue el contrato (/api/chat, think: false, format cerrado, localhost
    absoluto, follow_redirects=False); los cuatro adaptadores lo cumplen hoy (por ejemplo src/sirius/adapters/ollama_query_intent_classifier.py:13-19,
    «calcado del filtro real (ADR-125)»). Es un mecanismo más fuerte que la frase en la orden.'
  que_falta: 'El cliente único (deuda 4): ningún módulo compartido en src/sirius/adapters; y la regla
    para las órdenes no está escrita (grep «calcado del filtro» solo aparece en la propia bitácora; «ADR-125»
    no aparece en AGENTS.md ni en scripts/automation/prompts).'
  medible: 'Línea base: adaptadores nuevos que llegaron a revisión sin el contrato de ADR-125 (M21a: 1
    de 1, P1). Después: 0, medido por el guardián en Quality (rojo antes de la revisión) y por hallazgos
    P1 de contrato HTTP por ola.'
- entrada: 9
  titulo: 'M21a: el corrector del motor murió sin producir nada (13:14 → 13:45 UTC)'
  fecha: '2026-09-03'
  mecanismo: El corrector (repair-sirius-work.yml, run 33759989103) agotó su ejecución con «veredicto
    provisional no sustituido» y sin subir ningún commit, ante tres hallazgos de los que un P1 exigía
    rehacer el contrato HTTP y sus pruebas; la incidencia pasó a failed-safely sin diagnóstico.
  mejor_manera: 'Candidata de motor: que el corrector escriba un diagnóstico al morir (qué llegó a cambiar,
    en qué se quedó) y que ante un P1 que cambia un contrato pueda pedir una segunda ejecución en vez
    de morir en silencio.'
  deuda: 8
  estado_en_main: parcial
  evidencia: 'ADR-155 APROBADO («el corrector entrega por hallazgo con el plazo a la vista»): scripts/automation/prompts/corrector.md:60-74
    (hora de muerte del paso y hora límite en el contexto; corregir por severidad; commit y push tras
    cada hallazgo; al llegar el plazo, validar una vez, empujar y escribir FIXED nombrando lo corregido
    y lo no corregido). ADR-150 APROBADO: paso del corrector 30 → 36 min y job 85 (.github/workflows/repair-sirius-work.yml:78).
    Veredicto provisional obligatorio: corrector.md:195-223. La mina 2026-09 §5 (docs/audits/SIRIUS_MINA_APRENDIZAJE_OPERATIVO_2026-09.md:159-180)
    midió que las muertes se dan cuando el arreglo exige reescribir un contrato entero.'
  que_falta: 'El diagnóstico cuando muere de verdad por corte duro: el provisional solo dice «ronda interrumpida»,
    y repair-sirius-work.yml:80-95 declara que un proceso que muere no puede informar de su muerte; y
    la «segunda ejecución» explícita ante un P1 de contrato no existe (ADR-141 solo re-arma rondas por
    fallo de infraestructura del revisor). Lo que hay es la entrega parcial antes del plazo, que hace
    que lo empujado sobreviva y que la ronda siguiente retome el resto.'
  medible: 'Línea base: muertes del corrector sin ningún commit (ola de criticidad: 3 de 15 rondas, mina
    §5; 31,0 / 31,9 / 23,7 min). Después: rondas que mueren sin push por cada 10 rondas con ≥ 2 hallazgos,
    y hallazgos entregados por ronda (ADR-155 en vivo: 2/4 y 3/4 según la deuda 8).'
- entrada: 10
  titulo: Predicciones mías que fallaron (registradas en sus ADR)
  fecha: '2026-09-03'
  mecanismo: 'Dos predicciones de la nota de arranque fallaron por el mecanismo, no por la cifra: M19a
    «elementos de más 260±5» → 290 (la variante A del script sustituía el índice topical; producción lo
    suma; ADR-127) y M20 «cobertura 71/81» → 72 (la siembra actúa en las 47 consultas, no en las 2 que
    el arnés marca; ADR-129).'
  mejor_manera: Predecir el mecanismo, no solo la cifra; y cuando la cifra dependa de cuántas consultas
    activan algo, contar esas consultas antes.
  deuda: null
  estado_en_main: abierta
  evidencia: Sin evidencia. .claude/skills/medir-con-linea-base/SKILL.md:37-40 pide escribir antes de
    medir «qué cifra manda, el suelo y qué resultado hace parar», y .claude/skills/disciplina-evidencia/SKILL.md:22-36
    fija las cuatro preguntas de la nota de arranque; ninguna pide predecir el mecanismo ni contar las
    consultas que activan la palanca.
  que_falta: 'La regla «predecir el mecanismo y contar antes las consultas que activan la palanca» en
    medir-con-linea-base o en la nota de arranque. Patrones usados: «predic|mecanismo|contar (esas|las)
    consultas» en .claude/skills/medir-con-linea-base, .claude/skills/disciplina-evidencia y AGENTS.md.'
  medible: 'Línea base: predicciones de cifra falladas por mecanismo en los ADR de la ola (ADR-127 y ADR-129;
    la mina v2 añade 2 de 4). Después: proporción de ADR de medición cuya nota de arranque declara el
    mecanismo y el recuento de consultas activadas, y aciertos dentro del margen declarado.'
- entrada: 11
  titulo: Coste de la vigilancia
  fecha: '2026-09-03'
  mecanismo: Vigilar cada 2 minutos recargaba todo el contexto de la sesión en cada tic; el propietario
    lo notó en el consumo del plan. Se bajó la cadencia a 7-10 minutos.
  mejor_manera: 'La rutina programada de la entrada 4: vigilancia con modelo barato y aviso solo por cambio
    de etiqueta; el modelo caro solo para revisar y decidir.'
  deuda: 5
  estado_en_main: abierta
  evidencia: 'Sin evidencia del vigía barato. Lo más cercano: .claude/skills/modo-nocturno/SKILL.md:40-42,
    regla 3 («Despierta poco. Un repaso cada hora como mucho… Cada despertar es un turno»), y la skill
    coste-antes-de-tocar-una-fuente, que acotan el gasto de la sesión pero con el mismo modelo.'
  que_falta: 'Una rutina programada con modelo barato que avise solo por cambio de etiqueta: grep «vigía|Routine|rutina
    programada|modelo barato|send_later» en .claude/skills, AGENTS.md y docs/decisions sin resultado aplicable;
    deuda 5 abierta en la bitácora; ADR-216 APROBADO apaga los horarios del motor.'
  medible: 'Línea base: despertares por día de la sesión vigilante (bitácora: 95 en siete días la sesión
    del 08-09; 14 en nueve horas la del 13-09) y el consumo del plan que notó el propietario. Después:
    despertares del modelo caro por día con el vigía barato delante, y latencia del aviso por cambio de
    etiqueta.'
- entrada: 12
  titulo: Mi prueba por mutación me pisó el archivo nuevo (14:10 UTC)
  fecha: '2026-09-03'
  mecanismo: 'Al mutar el adaptador de M21a se mezcló sed con git checkout -- archivo y git stash: el
    checkout restauró la versión commiteada y se perdió la versión nueva sin commitear; la segunda mutación
    se midió contra el código viejo.'
  mejor_manera: 'Regla fija para mutaciones: copia de respaldo con cp, mutar con python -c, ejecutar la
    prueba, restaurar con cp; nunca git checkout/stash sobre trabajo sin commitear.'
  deuda: null
  estado_en_main: resuelta
  evidencia: '.claude/skills/cadena-de-comprobacion/SKILL.md:62-70: «Nunca git checkout -- <fichero> sobre
    trabajo sin confirmar… Para deshacer una mutación, guarda una copia antes o aplica la mutación desde
    un fichero aparte» y «comprueba con git diff que el árbol cambió de verdad antes de creerte el 16
    passed»; skill registrada en MEMORIA.md y aprobada por ADR-211/ADR-213 APROBADOS. Para el corrector,
    ADR-140 APROBADO exige demostrar cada mutación con su salida.'
  que_falta: null
  medible: 'Línea base: ediciones perdidas por restaurar con git sobre trabajo sin commitear (03-09 y
    20-09: dos casos registrados en la bitácora y en la skill). Después: 0 casos por trimestre en la bitácora
    y en docs/audits/registro_defectos.yml.'
- entrada: 13
  titulo: El agente de exploración cayó por sobrecarga de la API (14:42 UTC)
  fecha: '2026-09-03'
  mecanismo: El subagente lanzado para inventariar la interfaz murió con un 529 (Overloaded) sin devolver
    nada; el inventario se hizo a mano con búsquedas directas, más barato y suficiente para redactar la
    orden de M21b.
  mejor_manera: Para inventarios acotados (menos de diez preguntas con archivos conocidos), búsquedas
    directas; reservar los subagentes para barridos anchos.
  deuda: null
  estado_en_main: abierta
  evidencia: 'Solo por analogía: .claude/skills/coste-antes-de-tocar-una-fuente/SKILL.md:14-15 («lo caro
    se toca solo si lo barato no contesta») y el paso 2 «La fuente más barata primero», con tope de diez
    agentes; su disparador es «más de tres agentes» o «más de un megabyte», así que no alcanza a un único
