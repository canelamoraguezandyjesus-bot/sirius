# EL REGISTRO DE LOS BLOQUES DEL MOTOR
#
# Este fichero existe por una frase del propietario, el 25-08-2026:
# «empezamos construyendo el bloque, diciendo que está terminado, hablando de
# bloques, y al final no está terminado».
#
# Y por un malentendido concreto: le dijeron «están todos los bloques hechos» y
# era VERDAD -de los 16 bloques del PRODUCTO, cerrados el 10-08-2026-. Él lo
# entendió como todo, porque nadie dijo de qué lista se hablaba. Hay dos listas
# y se llaman igual, y hasta comparten un identificador: `B1` es un bloque del
# producto Y un bloque del motor, dos cosas distintas.
#
# Por eso aquí NO se dice «los bloques». Se dice «los bloques del motor», y sus
# identificadores van siempre con ese apellido.
#
# REGLA: `estado: cerrado` exige `evidencia`, y la evidencia es una comprobación
# que alguien puede repetir -no una afirmación-. Lo hace cumplir
# `tests/automation/test_registro_de_bloques.py`, igual que ADR-080 hace con el
# registro de defectos.
#
# Estados: cerrado | en_curso | pendiente | fuera_de_alcance
# Medido el 25-08-2026 sobre `main`. Las fechas de los cerrados vienen de la
# foto del 21-08; lo demás se midió hoy, comando a comando.

lista: bloques-del-motor
no_confundir_con: los 16 bloques del producto Sirius 0.1, cerrados el 10-08-2026

bloques:
  - id: E0
    titulo: El permiso escrito para construir el motor
    estado: cerrado
    evidencia: fechado el 15-08-2026 en la foto DONDE_ESTAMOS_2026-08-21.md

  - id: A1
    titulo: Las reglas del juego, qué es un trabajo y qué saltos están prohibidos
    estado: cerrado
    evidencia: fechado el 17-08-2026; el dominio vive en src/sirius_engine/domain/

  - id: S1
    titulo: Experimento desechable, cómo guardar en disco sin perder ni duplicar
    estado: cerrado
    evidencia: fechado el 17-08-2026; su patrón es el del diario durable (ADR-026)

  - id: A2
    titulo: El motor ya no olvida al reiniciarse
    estado: cerrado
    evidencia: fechado el 18-08-2026; adapters/durable/store.py reproduce el diario al construirse

  - id: A3
    titulo: El motor ya puede mirar GitHub, sin tocar nada
    estado: cerrado
    evidencia: fechado el 18-08-2026; adapters/github_actions_run_observer.py

  - id: A4
    titulo: Qué puede y qué no puede hacer cada rol, y la barrera de salida de datos
    estado: cerrado
    evidencia: fechado el 19-08-2026

  - id: E1a
    titulo: Quién manda sobre cada tipo de trabajo, contrato v1.7
    estado: cerrado
    evidencia: fechado el 19-08-2026; domain/authority.py es función total sobre WorkItemClass

  - id: A5
    titulo: Distinguir charla de orden, presupuesto con corte, escalado al propietario
    estado: cerrado
    evidencia: fechado el 21-08-2026; intent_interpreter.py y gate.py, reforzados por H-19 el 25-08

  - id: S2
    titulo: Probar si el investigador externo funciona y qué cuesta
    estado: pendiente
    que_lo_cerraria: una medición del coste y del resultado con un investigador real
    medido_hoy: no existe ningún adaptador de investigación en src/sirius_engine/adapters/

  - id: B1
    titulo: Que Sirius investigue de verdad desde una orden
    estado: pendiente
    depende_de: S2
    que_lo_cerraria: que una orden de clase investigacion produzca un resultado
    medido_hoy: la clase `investigacion` no está en TABLA_ACTIVACION, así que ni se despacha
    ojo: este B1 es del MOTOR y no tiene nada que ver con el B1 del producto

  - id: E1b
    titulo: Contrato v1.8, permitir al motor activar y vigilar
    estado: cerrado
    evidencia: AUTOMATION_OPERATING_CONTRACT.md incluye §11.2, §11.3, §11.4 y §12.4

  - id: S3
    titulo: Medir cuándo GitHub dice que algo terminó
    estado: cerrado
    evidencia: adapters/github_actions_run_probe.py y su observador, usados por la supervisión

  - id: C1
    titulo: Que el motor desatasque solo lo que se cuelga
    estado: cerrado
    evidencia: recovery.py y supervisor.py, invocados por `sirius-supervisar` desde motor-sirius.yml

  - id: C2
    titulo: Una orden tuya y no tocas GitHub hasta «fusiona»
    estado: cerrado
    evidencia: >-
      Ejecutado en el servidor el 25-08-2026, run 32860766536 (ensayo) y el
      siguiente con `ejecutar: true`. El despachador publicó la incidencia #333
      él mismo -etiqueta `sirius:implementing` a los 40 segundos, sin fallar la
      puerta de activación- y anotó el encargo en el diario: WI-20260825-144242
      pasa de `planned` a `active` en `diario.jsonl`, y `diario-despacho.jsonl`
      guarda su episodio con el número de incidencia. La rama `estado-del-motor`
      NACIÓ en ese push (commit c0c905b): antes no existía.

  - id: C3
    titulo: El mismo ciclo para documentos
    estado: cerrado
    evidencia: >-
      Cerrado el 25-08-2026 en dos mitades, porque ADR-002 no deja que la misma
      mano haga las dos. La de workflows, en sesión interactiva (PR #335,
      ADR-088): implement-sirius-work.yml y review-sirius-work.yml leen el campo
      `Perfil:` del cuerpo y eligen prompt, en vez de tenerlo clavado a fuego.
      La de `src/`, por el propio ciclo (PR #339, incidencia #336): las filas
      DOCUMENTACION en TABLA_ACTIVACION y TABLA_PERFILES. Verificada la cadena
      entera ejecutando: «Documenta el estado del motor» -> clase documentacion
      -> despachable con sirius:planned + sirius:implement-requested -las mismas
      que programacion, que es lo que exige el título del bloque- -> Perfil
      documentalista@1 -> el workflow elige prompts/documentalista.md. Las dos
      pruebas nuevas se ven fallar contra main con ClaseNoDespachableError.

  - id: C4
    titulo: La auditoría dentro del motor
    estado: cerrado
    evidencia: la clase `auditoria` está en TABLA_ACTIVACION y audit-sirius-repository.yml la atiende

  - id: D1
    titulo: Pasar el mando de GitHub al motor, clase por clase
    estado: pendiente
    que_lo_cerraria: siete días consecutivos en verde por clase (contrato §11.2)
    medido_hoy: >-
      sus tres mitades existen -projection_verifier.py (D1a), seven_day_streak.py (D1b)
      y authority_reversion.py (D1c)- pero authority_reversion NO LO LLAMA NADIE fuera
      de sus propias pruebas. Es la salida de emergencia del §11.4: lo que devolvería
      el mando si el motor se porta mal. Construida, probada e inalcanzable.

  - id: D2
    titulo: Que el motor corra solo, siempre
    estado: en_curso
    que_lo_cerraria: un horario, y un turno real que anote algo en el diario
    medido_hoy: >-
      arranca y su camino de escritura está probado por ejecución (ADR-083), pero
      motor-sirius.yml solo tiene workflow_dispatch: no corre solo

  - id: D3
    titulo: Hablar con Sirius por Telegram
    estado: fuera_de_alcance
    medido_hoy: >-
      declarado fuera del alcance aprobado ya en la foto del 21-08. Y el 25-08 el
      propietario decidió que su centro de mando es la sesión interactiva, así que
      este bloque no resuelve ningún problema que tenga hoy.

  - id: D4
    titulo: Partir un objetivo grande en bloques
    estado: pendiente
    incidencia: 341
    que_lo_cerraria: >-
      que un objetivo del tamaño de una versión entera se convierta en varios
      encargos atendibles sin que una persona los escriba uno a uno
    medido_hoy: >-
      no aparece en NINGÚN plan -ni «partir» ni «descomponer» ni «planificador»
      en docs/implementation/ ni en docs/decisions/-, no existe noción de trabajo
      padre/hijo en el dominio, y la clase MIXTA es inalcanzable por construcción
      (ADR-079). Es alcance nuevo, nombrado el 25-08-2026.
    decidido: >-
      ADR-089: lo hace la sesión interactiva. El descomponedor automático queda
      APLAZADO, no descartado, y cuando llegue tiene que ser con un modelo local
      o una API gratuita -no una de pago de Claude ni de ChatGPT-, por decisión
      del propietario.
